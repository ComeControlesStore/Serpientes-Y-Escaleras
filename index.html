<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#070a10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Serpientes & Escaleras</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#070a10;
    color:white;
    font-family:Arial,sans-serif;
}

button,input{
    font:inherit;
}

.app{
    width:100%;
    height:100dvh;
    min-height:100dvh;
    margin:0 auto;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% -10%,#31456c,#111827 48%,#070a10);
}

.screen{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    width:100%;
    height:100%;
    min-height:0;
}

.screen.active{
    display:flex;
}

/* ================= MENU ================= */

#menu{
    padding:
        max(7px,env(safe-area-inset-top))
        max(7px,env(safe-area-inset-right))
        max(7px,env(safe-area-inset-bottom))
        max(7px,env(safe-area-inset-left));

    overflow-y:auto;
    overflow-x:hidden;
    scrollbar-width:none;
}

#menu::-webkit-scrollbar{
    display:none;
}

.logo{
    text-align:center;
    flex-shrink:0;
}

.logo .emoji{
    font-size:clamp(25px,8vw,32px);
    line-height:1;
}

.logo h1{
    margin:3px 0 0;
    font-size:clamp(17px,5.5vw,21px);
    line-height:1.05;
    font-weight:1000;
}

.logo p{
    margin:4px 0 7px;
    color:#9eabc0;
    font-size:8px;
}

.card{
    width:100%;
    background:#151e2e;
    border:1px solid #2e3b54;
    border-radius:12px;
    padding:7px;
    box-shadow:0 8px 20px #0007;
}

.card h2{
    margin:0 0 5px;
    font-size:12px;
}

/* ================= JUGADORES ================= */

.countOptions{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:4px;
    margin-bottom:6px;
}

.countButton{
    height:30px;
    border:1px solid #46536b;
    border-radius:7px;
    background:#202a3d;
    color:white;
    font-size:11px;
    font-weight:1000;
}

.countButton.selected{
    background:#ffd84d;
    color:#17120a;
    border-color:#ffd84d;
}

.playerSetup{
    display:grid;
    gap:4px;
}

.setupPlayer{
    width:100%;
    display:flex;
    align-items:center;
    gap:4px;
    background:#202a3d;
    padding:3px;
    border-radius:7px;
    min-width:0;
}

.setupAvatar{
    width:32px;
    height:32px;
    flex:0 0 32px;
    border:0;
    border-radius:7px;
    background:#303d55;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    line-height:1;
    overflow:hidden;
}

.nameInput{
    width:clamp(65px,22vw,105px);
    min-width:45px;
    border:0;
    outline:0;
    background:#111827;
    color:white;
    border-radius:6px;
    padding:6px;
    font-size:10px;
}

.botButton{
    width:40px;
    height:28px;
    flex:0 0 40px;
    border:1px solid #46536b;
    border-radius:6px;
    background:#29344a;
    color:white;
    font-size:9px;
    font-weight:1000;
}

.botButton.active{
    background:#8c5cff;
    border-color:#b89cff;
}

/* ================= EMOJIS ================= */

.avatarWrap{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    gap:3px;
}

.avatarOptions{
    flex:1;
    min-width:0;
    width:100%;
    height:31px;

    display:flex;
    align-items:center;
    gap:4px;

    overflow-x:auto;
    overflow-y:hidden;

    padding:2px 4px;

    scrollbar-width:none;
    -ms-overflow-style:none;

    touch-action:pan-x;
    overscroll-behavior-x:contain;
    -webkit-overflow-scrolling:touch;
}

.avatarOptions::-webkit-scrollbar{
    display:none;
    width:0;
    height:0;
}

.avatarOption{
    flex:0 0 30px;
    width:30px;
    height:27px;

    border:1px solid #46536b;
    border-radius:6px;

    background:#29344a;
    color:white;

    padding:0;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:17px;
    line-height:1;

    white-space:nowrap;
    overflow:hidden;

    font-family:
        "Apple Color Emoji",
        "Segoe UI Emoji",
        "Noto Color Emoji",
        sans-serif;
}

.avatarOption.selected{
    border:2px solid #ffd84d;
    background:#46536b;
}

.avatarArrow{
    width:22px;
    height:27px;
    flex:0 0 22px;

    border:0;
    border-radius:5px;

    background:#394862;
    color:#ffd84d;

    font-size:13px;
    font-weight:1000;

    display:flex;
    align-items:center;
    justify-content:center;
}

.avatarArrow:active{
    transform:scale(.9);
    background:#46536b;
}

/* ================= BOTONES ================= */

.mainButton{
    width:100%;
    border:0;
    border-radius:8px;
    padding:8px;
    margin-top:5px;
    background:#ffd84d;
    color:#17120a;
    font-size:10px;
    font-weight:1000;
    box-shadow:0 2px 0 #b99520;
}

.secondaryButton{
    width:100%;
    border:1px solid #394862;
    border-radius:8px;
    padding:7px;
    margin-top:4px;
    background:#202b41;
    color:white;
    font-size:9px;
    font-weight:900;
}

/* ================= JUEGO ================= */

#game{
    padding:
        max(3px,env(safe-area-inset-top))
        max(3px,env(safe-area-inset-right))
        max(3px,env(safe-area-inset-bottom))
        max(3px,env(safe-area-inset-left));

    min-height:0;
}

.top{
    width:100%;
    height:31px;
    display:flex;
    align-items:center;
    gap:3px;
    flex:0 0 31px;
}

.icon{
    width:29px;
    height:29px;
    flex:0 0 29px;
    border:0;
    border-radius:7px;
    background:#202b41;
    color:white;
    font-size:13px;
}

.turn{
    flex:1;
    min-width:0;
    height:29px;
    background:#202b41;
    border-radius:7px;

    display:flex;
    align-items:center;
    gap:4px;

    padding:0 6px;

    font-size:8px;
    font-weight:1000;

    overflow:hidden;
    white-space:nowrap;
}

#turnAvatar{
    flex:0 0 auto;
    font-size:12px;
}

#turnText{
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ================= TABLERO ================= */

#boardArea{
    flex:1 1 auto;
    min-height:0;
    min-width:0;

    width:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:2px 0;
}

#board{
    width:min(
        100%,
        calc(100dvh - 155px),
        350px
    );

    max-width:100%;
    max-height:100%;

    aspect-ratio:1/1;

    position:relative;
    overflow:hidden;

    border-radius:10px;

    background:#e7d09c;

    box-shadow:
        0 8px 18px #000b,
        inset 0 0 0 2px #765e35;
}

.cell{
    position:absolute;

    width:10%;
    height:10%;

    padding:1px;

    display:flex;
    align-items:flex-start;
    justify-content:flex-end;

    border:1px solid #927d5055;

    color:#322817;

    font-size:clamp(5px,1.7vw,7px);
    font-weight:1000;

    z-index:1;
}

.cell:nth-child(odd){
    background:#fff1c7;
}

.cell:nth-child(even){
    background:#e5cc94;
}

.start{
    background:#92e39a!important;
}

.finish{
    background:#ffd84d!important;
}

.connections{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:5;
    pointer-events:none;
}

.token{
    position:absolute;

    width:6.5%;
    height:6.5%;

    max-width:22px;
    max-height:22px;

    min-width:12px;
    min-height:12px;

    border:1.5px solid white;
    border-radius:50%;

    z-index:20;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:clamp(7px,2.8vw,11px);
    line-height:1;

    box-shadow:
        0 3px 5px #000b,
        inset 0 0 5px #fff8;

    transition:
        left .1s,
        top .1s;
}

/* ================= PANEL ================= */

.bottom{
    width:100%;
    flex:0 0 auto;

    background:#151e2e;
    border:1px solid #2e3b54;
    border-radius:10px;

    padding:3px;
}

.players{
    width:100%;
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:2px;
}

.playerBox{
    min-width:0;

    background:#202a3d;
    border:1px solid transparent;
    border-radius:6px;

    padding:2px;
    text-align:center;
}

.playerBox.active{
    border-color:#ffd84d;
}

.avatar{
    font-size:11px;
    line-height:12px;
}

.playerName{
    font-size:6px;
    line-height:7px;
    font-weight:1000;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.position{
    color:#98a5bb;
    font-size:5px;
    line-height:6px;
}

.controls{
    display:flex;
    gap:3px;
    margin-top:3px;
}

.dice{
    width:37px;
    height:37px;
    flex:0 0 37px;

    border-radius:8px;

    background:white;
    color:#111;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:19px;

    box-shadow:0 2px 0 #aeb3bd;
}

.roll{
    flex:1;
    margin:0;
    padding:7px;
    font-size:10px;
}

.status{
    height:10px;
    margin-top:1px;

    text-align:center;

    color:#aeb9cc;

    font-size:7px;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

/* ================= GANADOR ================= */

#win{
    align-items:center;
    justify-content:center;
    padding:15px;
    text-align:center;
}

.trophy{
    font-size:55px;
    animation:bounce 1s infinite alternate;
}

@keyframes bounce{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-8px);
    }
}

.winTitle{
    font-size:24px;
    font-weight:1000;
    margin:5px 0;
}

.winText{
    color:#aeb9cc;
    font-size:10px;
}

.winButtons{
    width:100%;
    max-width:280px;
    margin-top:8px;
}

/* ================= PANTALLAS PEQUEÑAS ================= */

@media(max-height:600px){

    .logo .emoji{
        font-size:24px;
    }

    .logo h1{
        font-size:17px;
    }

    .logo p{
        margin:2px 0 4px;
    }

    .card{
        padding:5px;
    }

    .setupPlayer{
        padding:2px;
    }

    .setupAvatar{
        width:29px;
        height:29px;
        flex-basis:29px;
        font-size:16px;
    }

    .avatarOptions{
        height:28px;
    }

    .avatarOption{
        width:28px;
        height:24px;
        flex-basis:28px;
        font-size:15px;
    }

    .mainButton{
        padding:6px;
    }

    .secondaryButton{
        padding:5px;
    }
}

@media(min-width:500px){

    .app{
        max-width:390px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= MENU ================= -->

<section id="menu" class="screen active">

    <div class="logo">

        <div class="emoji">
            🎲🐍🪜
        </div>

        <h1>
            SERPIENTES &amp; ESCALERAS
        </h1>

        <p>
            El clásico juego de suerte y caos
        </p>

    </div>

    <div class="card">

        <h2>
            👥 ¿Cuántos jugadores?
        </h2>

        <div class="countOptions">

            <button class="countButton selected" data-count="2">
                2
            </button>

            <button class="countButton" data-count="3">
                3
            </button>

            <button class="countButton" data-count="4">
                4
            </button>

            <button class="countButton" data-count="5">
                5
            </button>

        </div>

        <h2>
            🎮 Jugadores
        </h2>

        <div id="playerSetup" class="playerSetup"></div>

        <button class="mainButton" onclick="startGame()">
            🎲 EMPEZAR PARTIDA
        </button>

        <button class="secondaryButton" onclick="showRules()">
            📖 REGLAS
        </button>

    </div>

</section>


<!-- ================= JUEGO ================= -->

<section id="game" class="screen">

    <div class="top">

        <button class="icon" onclick="goMenu()">
            ☰
        </button>

        <div class="turn">

            <span id="turnAvatar">
                😀
            </span>

            <span id="turnText">
                Turno
            </span>

        </div>

        <button class="icon" onclick="newMap()">
            🔄
        </button>

    </div>

    <div id="boardArea">

        <div id="board"></div>

    </div>

    <div class="bottom">

        <div id="playersPanel" class="players"></div>

        <div class="controls">

            <div id="dice" class="dice">
                ⚀
            </div>

            <button
                id="rollButton"
                class="mainButton roll"
                onclick="rollDice()">

                🎲 TIRAR DADO

            </button>

        </div>

        <div id="status" class="status">
            Tira el dado para comenzar
        </div>

    </div>

</section>


<!-- ================= GANADOR ================= -->

<section id="win" class="screen">

    <div class="trophy">
        🏆
    </div>

    <div id="winTitle" class="winTitle">
        ¡Ganaste!
    </div>

    <div id="winText" class="winText">
        Llegaste a la casilla 100.
    </div>

    <div class="winButtons">

        <button class="mainButton" onclick="startGame()">
            🔄 JUGAR OTRA VEZ
        </button>

        <button class="secondaryButton" onclick="goMenu()">
            🏠 MENÚ
        </button>

    </div>

</section>

</div>


<script>

/* =========================================================
   DATOS
========================================================= */

const colors = [
    "#ff5368",
    "#54a7ff",
    "#8be35c",
    "#b46cff",
    "#ff9f43"
];

const avatars = [

    "😀","😃","😄","😁","😆","😅","😂","🤣",
    "😊","😇","🙂","🙃","😉","😌","😍","🥰",
    "😘","😗","😙","😚","😋","😛","😝","😜",
    "🤪","🤨","🧐","🤓","😎","🤩","🥳","😏",
    "😒","😞","😔","😟","😕","🙁","☹️","😣",
    "😖","😫","😩","🥺","😢","😭","😤","😠",
    "😡","🤬","🤯","😳","🥵","🥶","😱","😨",
    "😰","😥","😓","🤗","🤔","🫣","🤭","🫢",
    "🤫","🤥","😶","🫠","😐","😑","😬","🙄",
    "😯","😦","😧","😮","😲","🥱","😴","🤤",
    "😪","😵","🤐","🥴","🤢","🤮","🤧","😷",

    "🤠","🥸","👻","💀","☠️","👽","👾","🤖",
    "🎃","😈","👿","👹","👺","🤡","💩",

    "🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼",
    "🐨","🐯","🦁","🐮","🐷","🐸","🐵","🙈",
    "🙉","🙊","🐒","🐔","🐧","🐦","🐤","🦆",
    "🦅","🦉","🐺","🐗","🐴","🦄","🐝","🐛",
    "🦋","🐌","🐞","🐜","🪲","🕷️","🦂","🐢",
    "🐍","🦎","🦖","🦕","🐙","🦑","🦀","🐠",
    "🐟","🐡","🐬","🐳","🦈","🐊","🐘","🦏",
    "🦛","🐪","🐫","🦒","🦘","🦬","🐄","🐎",
    "🐖","🐑","🦙","🐐","🦌","🐕","🐈","🦮",
    "🐕‍🦺","🐈‍⬛","🪽","🦜","🦚","🦩","🦢",
    "🦤","🦃",

    "🍕","🍔","🍟","🌭","🍿","🍩","🍪","🍫",
    "🍎","🍉","🍓","🍌","🍇","🍒","🥝","🥑",
    "🍍","🥭","🍊","🍋","🍈","🍑","🍐","🍏",

    "⚽","🏀","🏈","⚾","🎾","🏐","🎱","🏆",
    "🎮","🕹️","🎲","🎯","🎳","🏹","🥊","🥋",

    "🚗","🏎️","🚕","🚌","🚓","🚑","🚒","🚜",
    "🚀","✈️","🚁","🚢","🚂","🚲","🛵","🛸",

    "🔥","⭐","🌟","💎","💥","⚡","🌈","☀️",
    "🌙","🌪️","❄️","☁️","🌊","🌋","🌎",

    "👑","🎩","🕶️","🥷","🧙","🧛","🧟","🧞",
    "🧜","🦸","🦹","👮","🕵️","👨‍🚀","💪",
    "👀","👋","👍","👎","👏","🙌","🤝","✌️",

    "❤️","🧡","💛","💚","💙","💜","🖤","🤍",
    "🤎","💖","💗","💓","💞","💕","💯","✨"
];

const diceFaces = [
    "⚀","⚁","⚂","⚃","⚄","⚅"
];

let selectedAvatar = [0,1,2,3,4];

let botPlayers = [
    false,
    false,
    false,
    false,
    false
];

let playerCount = 2;

let players = [];

let ladders = {};
let snakes = {};

let currentPlayer = 0;

let rolling = false;
let gameFinished = false;


/* =========================================================
   UTILIDADES
========================================================= */

function sleep(ms){
    return new Promise(
        resolve => setTimeout(resolve,ms)
    );
}

function random(min,max){
    return Math.floor(
        Math.random()*(max-min+1)
    )+min;
}

function escapeHTML(text){
    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   PANTALLAS
========================================================= */

function show(id){

    document
        .querySelectorAll(".screen")
        .forEach(screen =>
            screen.classList.remove("active")
        );

    document
        .getElementById(id)
        .classList.add("active");
}

function goMenu(){

    rolling = false;
    gameFinished = false;

    show("menu");

    createPlayerSetup();
}

function showRules(){

    alert(
        "🐍 SERPIENTES & ESCALERAS\n\n"+
        "🎲 Tira el dado y avanza.\n\n"+
        "🪜 Si caes en una escalera, subes.\n\n"+
        "🐍 Si caes en una serpiente, bajas.\n\n"+
        "🏆 Debes llegar exactamente al 100.\n\n"+
        "🤖 Los jugadores marcados como BOT juegan automáticamente."
    );
}


/* =========================================================
   CANTIDAD
========================================================= */

document
.querySelectorAll(".countButton")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            playerCount =
                Number(button.dataset.count);

            playerCount =
                Math.max(
                    2,
                    Math.min(
                        5,
                        playerCount
                    )
                );

            document
            .querySelectorAll(".countButton")
            .forEach(b =>
                b.classList.remove("selected")
            );

            button.classList.add("selected");

            createPlayerSetup();
        }
    );
});


/* =========================================================
   CONFIGURACIÓN
========================================================= */

function createPlayerSetup(){

    const container =
        document.getElementById(
            "playerSetup"
        );

    container.innerHTML = "";

    for(let i=0;i<playerCount;i++){

        const row =
            document.createElement("div");

        row.className =
            "setupPlayer";


        const avatar =
            document.createElement("button");

        avatar.className =
            "setupAvatar";

        avatar.textContent =
            avatars[selectedAvatar[i]];


        const input =
            document.createElement("input");

        input.className =
            "nameInput";

        input.id =
            `name${i}`;

        input.placeholder =
            `Jugador ${i+1}`;

        input.maxLength = 12;


        const bot =
            document.createElement("button");

        bot.className =
            "botButton";

        bot.textContent =
            botPlayers[i]
                ? "🤖"
                : "👤";


        if(botPlayers[i]){
            bot.classList.add("active");
        }


        bot.addEventListener(
            "click",
            () => {

                botPlayers[i] =
                    !botPlayers[i];

                bot.classList.toggle(
                    "active",
                    botPlayers[i]
                );

                bot.textContent =
                    botPlayers[i]
                        ? "🤖"
                        : "👤";
            }
        );


        const avatarWrap =
            document.createElement("div");

        avatarWrap.className =
            "avatarWrap";


        const options =
            document.createElement("div");

        options.className =
            "avatarOptions";


        for(let a=0;a<avatars.length;a++){

            const option =
                document.createElement("button");

            option.className =
                "avatarOption";

            option.textContent =
                avatars[a];


            if(a===selectedAvatar[i]){
                option.classList.add(
                    "selected"
                );
            }


            option.addEventListener(
                "click",
                () => {

                    selectedAvatar[i] = a;

                    avatar.textContent =
                        avatars[a];

                    options
                    .querySelectorAll(
                        ".avatarOption"
                    )
                    .forEach(x =>
                        x.classList.remove(
                            "selected"
                        )
                    );

                    option.classList.add(
                        "selected"
                    );

                    option.scrollIntoView({
                        behavior:"smooth",
                        block:"nearest",
                        inline:"center"
                    });
                }
            );


            options.appendChild(option);
        }


        const arrow =
            document.createElement("button");

        arrow.className =
            "avatarArrow";

        arrow.textContent =
            "▶";


        arrow.addEventListener(
            "click",
            () => {

                options.scrollBy({
                    left:150,
                    behavior:"smooth"
                });
            }
        );


        avatarWrap.appendChild(options);
        avatarWrap.appendChild(arrow);

        row.appendChild(avatar);
        row.appendChild(input);
        row.appendChild(bot);
        row.appendChild(avatarWrap);

        container.appendChild(row);
    }
}


/* =========================================================
   MAPA
========================================================= */

function getRow(cell){
    return Math.floor((cell-1)/10);
}

function getCol(cell){

    const row =
        getRow(cell);

    const position =
        (cell-1)%10;

    return row%2===0
        ? position
        : 9-position;
}

function tooClose(a,b){
    return Math.abs(a-b)<7;
}


function generateMap(){

    ladders = {};
    snakes = {};

    let tries = 0;


    /* ESCALERAS */

    while(
        Object.keys(ladders).length < 5 &&
        tries < 1500
    ){

        tries++;

        const a =
            random(2,75);

        const b =
            random(a+8,99);


        if(
            b>99 ||
            tooClose(a,b) ||
            a===1 ||
            a===100 ||
            b===1 ||
            b===100
        ){
            continue;
        }


        let conflict = false;


        for(const [x,y]
            of Object.entries(ladders)){

            if(
                tooClose(a,Number(x)) ||
                tooClose(b,Number(y)) ||
                tooClose(a,Number(y)) ||
                tooClose(b,Number(x))
            ){
                conflict = true;
                break;
            }
        }


        if(conflict) continue;


        for(const [x,y]
            of Object.entries(snakes)){

            if(
                tooClose(a,Number(x)) ||
                tooClose(b,Number(y)) ||
                tooClose(a,Number(y)) ||
                tooClose(b,Number(x))
            ){
                conflict = true;
                break;
            }
        }


        if(conflict) continue;

        ladders[a] = b;
    }


    /* SERPIENTES */

    tries = 0;


    while(
        Object.keys(snakes).length < 6 &&
        tries < 2000
    ){

        tries++;

        const a =
            random(25,99);

        const b =
            random(2,a-8);


        if(
            b<2 ||
            b>=a ||
            a===100 ||
            tooClose(a,b)
        ){
            continue;
        }


        let conflict = false;


        for(const [x,y]
            of Object.entries(ladders)){

            if(
                tooClose(a,Number(x)) ||
                tooClose(b,Number(y)) ||
                tooClose(a,Number(y)) ||
                tooClose(b,Number(x))
            ){
                conflict = true;
                break;
            }
        }


        if(conflict) continue;


        for(const [x,y]
            of Object.entries(snakes)){

            if(
                tooClose(a,Number(x)) ||
                tooClose(b,Number(y)) ||
                tooClose(a,Number(y)) ||
                tooClose(b,Number(x))
            ){
                conflict = true;
                break;
            }
        }


        if(conflict) continue;

        snakes[a] = b;
    }


    /* RESPALDO */

    if(
        Object.keys(ladders).length < 5
    ){

        ladders = {
            4:14,
            9:31,
            20:38,
            28:54,
            51:72
        };
    }


    if(
        Object.keys(snakes).length < 6
    ){

        snakes = {
            17:7,
            36:16,
            48:26,
            62:43,
            79:59,
            96:74
        };
    }
}


/* =========================================================
   POSICIONES
========================================================= */

function cellPosition(cell){

    const row =
        getRow(cell);

    const col =
        getCol(cell);

    return {
        x:col*10+5,
        y:(9-row)*10+5
    };
}


/* =========================================================
   TABLERO
========================================================= */

function buildBoard(){

    const board =
        document.getElementById(
            "board"
        );

    board.innerHTML = "";


    for(let n=1;n<=100;n++){

        const cell =
            document.createElement("div");

        cell.className =
            "cell";


        if(n===1){
            cell.classList.add("start");
        }


        if(n===100){
            cell.classList.add("finish");
        }


        const row =
            getRow(n);

        const col =
            getCol(n);


        cell.style.left =
            `${col*10}%`;

        cell.style.top =
            `${(9-row)*10}%`;

        cell.textContent =
            n;

        board.appendChild(cell);
    }


    const svg =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
        );

    svg.classList.add(
        "connections"
    );

    svg.setAttribute(
        "viewBox",
        "0 0 100 100"
    );


    for(const [from,to]
        of Object.entries(ladders)){

        drawLadder(
            svg,
            Number(from),
            Number(to)
        );
    }


    for(const [from,to]
        of Object.entries(snakes)){

        drawSnake(
            svg,
            Number(from),
            Number(to)
        );
    }


    board.appendChild(svg);


    players.forEach(
        (player,i) => {

            const token =
                document.createElement(
                    "div"
                );

            token.id =
                `token${i}`;

            token.className =
                "token";

            token.style.background =
                player.color;

            token.textContent =
                player.avatar;

            board.appendChild(token);
        }
    );
}


/* =========================================================
   ESCALERA REAL
========================================================= */

function drawLadder(svg,from,to){

    const a =
        cellPosition(from);

    const b =
        cellPosition(to);


    const dx =
        b.x-a.x;

    const dy =
        b.y-a.y;


    const len =
        Math.sqrt(
            dx*dx+dy*dy
        );


    const nx =
        -dy/len*1.35;

    const ny =
        dx/len*1.35;


    const group =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );


    const rail1 =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );

    const rail2 =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );


    rail1.setAttribute("x1",a.x+nx);
    rail1.setAttribute("y1",a.y+ny);
    rail1.setAttribute("x2",b.x+nx);
    rail1.setAttribute("y2",b.y+ny);

    rail2.setAttribute("x1",a.x-nx);
    rail2.setAttribute("y1",a.y-ny);
    rail2.setAttribute("x2",b.x-nx);
    rail2.setAttribute("y2",b.y-ny);


    rail1.setAttribute("stroke","#8b5a2b");
    rail2.setAttribute("stroke","#8b5a2b");

    rail1.setAttribute("stroke-width","1.5");
    rail2.setAttribute("stroke-width","1.5");

    rail1.setAttribute("stroke-linecap","round");
    rail2.setAttribute("stroke-linecap","round");


    group.appendChild(rail1);
    group.appendChild(rail2);


    const steps =
        Math.max(
            2,
            Math.floor(len/7)
        );


    for(let i=1;i<steps;i++){

        const t =
            i/steps;

        const x =
            a.x+dx*t;

        const y =
            a.y+dy*t;


        const rung =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );


        rung.setAttribute(
            "x1",
            x+nx
        );

        rung.setAttribute(
            "y1",
            y+ny
        );

        rung.setAttribute(
            "x2",
            x-nx
        );

        rung.setAttribute(
            "y2",
            y-ny
        );


        rung.setAttribute(
            "stroke",
            "#8b5a2b"
        );

        rung.setAttribute(
            "stroke-width",
            "1.2"
        );


        group.appendChild(rung);
    }


    svg.appendChild(group);
}


/* =========================================================
   🐍 SERPIENTE REAL
========================================================= */

function drawSnake(svg,from,to){

    const a =
        cellPosition(from);

    const b =
        cellPosition(to);


    const dx =
        b.x-a.x;

    const dy =
        b.y-a.y;


    const length =
        Math.sqrt(
            dx*dx+dy*dy
        );


    const nx =
        -dy/length;

    const ny =
        dx/length;


    /*
       Curva principal.
       Se construyen varios puntos para que
       el cuerpo parezca una serpiente y no
       una línea que se arrepintió de existir.
    */

    const points = [];

    const segments =
        Math.max(
            8,
            Math.floor(length/3)
        );


    const amplitude =
        Math.min(
            6,
            Math.max(
                3,
                length*.08
            )
        );


    for(let i=0;i<=segments;i++){

        const t =
            i/segments;

        const baseX =
            a.x+dx*t;

        const baseY =
            a.y+dy*t;


        const wave =
            Math.sin(
                t*Math.PI*3
            ) * amplitude;


        points.push({
            x:baseX+nx*wave,
            y:baseY+ny*wave
        });
    }


    /*
       Sombra del cuerpo
    */

    const shadow =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polyline"
        );


    shadow.setAttribute(
        "points",
        points.map(
            p => `${p.x+0.7},${p.y+1}`
        ).join(" ")
    );


    shadow.setAttribute(
        "fill",
        "none"
    );

    shadow.setAttribute(
        "stroke",
        "#0007"
    );

    shadow.setAttribute(
        "stroke-width",
        "4.8"
    );

    shadow.setAttribute(
        "stroke-linecap",
        "round"
    );

    shadow.setAttribute(
        "stroke-linejoin",
        "round"
    );


    svg.appendChild(shadow);


    /*
       Cuerpo
    */

    const body =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polyline"
        );


    body.setAttribute(
        "points",
        points.map(
            p => `${p.x},${p.y}`
        ).join(" ")
    );


    body.setAttribute(
        "fill",
        "none"
    );

    body.setAttribute(
        "stroke",
        "#238b45"
    );

    body.setAttribute(
        "stroke-width",
        "4"
    );

    body.setAttribute(
        "stroke-linecap",
        "round"
    );

    body.setAttribute(
        "stroke-linejoin",
        "round"
    );


    svg.appendChild(body);


    /*
       Línea clara sobre el cuerpo
    */

    const highlight =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polyline"
        );


    highlight.setAttribute(
        "points",
        points.map(
            p =>
                `${p.x-nx*.8},${p.y-ny*.8}`
        ).join(" ")
    );


    highlight.setAttribute(
        "fill",
        "none"
    );

    highlight.setAttribute(
        "stroke",
        "#58c878"
    );

    highlight.setAttribute(
        "stroke-width",
        "0.9"
    );

    highlight.setAttribute(
        "stroke-linecap",
        "round"
    );


    svg.appendChild(highlight);


    /*
       Cabeza
    */

    const head =
        points[0];


    const headGroup =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );


    const headCircle =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );


    headCircle.setAttribute(
        "cx",
        head.x
    );

    headCircle.setAttribute(
        "cy",
        head.y
    );

    headCircle.setAttribute(
        "r",
        "3.1"
    );

    headCircle.setAttribute(
        "fill",
        "#19743a"
    );

    headCircle.setAttribute(
        "stroke",
        "#0e4c27"
    );

    headCircle.setAttribute(
        "stroke-width",
        "0.6"
    );


    headGroup.appendChild(
        headCircle
    );


    /*
       Dirección de la cabeza
    */

    const dirX =
        (points[1].x-head.x);

    const dirY =
        (points[1].y-head.y);

    const dirLength =
        Math.sqrt(
            dirX*dirX+
            dirY*dirY
        );


    const ux =
        dirX/dirLength;

    const uy =
        dirY/dirLength;


    /*
       Ojos
    */

    const eyeOffset = 1.25;


    const eye1 =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );

    const eye2 =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );


    eye1.setAttribute(
        "cx",
        head.x+ux*1.7+nx*eyeOffset
    );

    eye1.setAttribute(
        "cy",
        head.y+uy*1.7+ny*eyeOffset
    );


    eye2.setAttribute(
        "cx",
        head.x+ux*1.7-nx*eyeOffset
    );

    eye2.setAttribute(
        "cy",
        head.y+uy*1.7-ny*eyeOffset
    );


    eye1.setAttribute(
        "r",
        "0.75"
    );

    eye2.setAttribute(
        "r",
        "0.75"
    );


    eye1.setAttribute(
        "fill",
        "white"
    );

    eye2.setAttribute(
        "fill",
        "white"
    );


    headGroup.appendChild(eye1);
    headGroup.appendChild(eye2);


    /*
       Pupilas
    */

    const pupil1 =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );

    const pupil2 =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );


    pupil1.setAttribute(
        "cx",
        head.x+ux*2+nx*eyeOffset
    );

    pupil1.setAttribute(
        "cy",
        head.y+uy*2+ny*eyeOffset
    );


    pupil2.setAttribute(
        "cx",
        head.x+ux*2-nx*eyeOffset
    );

    pupil2.setAttribute(
        "cy",
        head.y+uy*2-ny*eyeOffset
    );


    pupil1.setAttribute(
        "r",
        "0.35"
    );

    pupil2.setAttribute(
        "r",
        "0.35"
    );


    pupil1.setAttribute(
        "fill",
        "#111"
    );

    pupil2.setAttribute(
        "fill",
        "#111"
    );


    headGroup.appendChild(pupil1);
    headGroup.appendChild(pupil2);


    /*
       Lengua bifurcada
    */

    const tongueStartX =
        head.x+ux*3;

    const tongueStartY =
        head.y+uy*3;


    const tongueEndX =
        head.x+ux*5;

    const tongueEndY =
        head.y+uy*5;


    const tongue =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    const forkX =
        tongueEndX;

    const forkY =
        tongueEndY;


    tongue.setAttribute(
        "d",
        `
        M ${tongueStartX} ${tongueStartY}
        L ${forkX} ${forkY}
        M ${forkX} ${forkY}
        L ${forkX+nx*1.2} ${forkY+ny*1.2}
        M ${forkX} ${forkY}
        L ${forkX-nx*1.2} ${forkY-ny*1.2}
        `
    );


    tongue.setAttribute(
        "fill",
        "none"
    );

    tongue.setAttribute(
        "stroke",
        "#ef3340"
    );

    tongue.setAttribute(
        "stroke-width",
        "0.65"
    );

    tongue.setAttribute(
        "stroke-linecap",
        "round"
    );


    headGroup.appendChild(
        tongue
    );


    svg.appendChild(
        headGroup
    );
}


/* =========================================================
   TOKENS
========================================================= */

function placeToken(index){

    const player =
        players[index];

    const pos =
        cellPosition(
            player.pos
        );


    const offsets = [
        [-5,-5],
        [5,-5],
        [-5,5],
        [5,5],
        [0,0]
    ];


    const offset =
        offsets[index] || [0,0];


    const token =
        document.getElementById(
            `token${index}`
        );


    if(!token) return;


    token.style.left =
        `calc(${pos.x}% - ${offset[0]}%)`;

    token.style.top =
        `calc(${pos.y}% - ${offset[1]}%)`;

    token.textContent =
        player.avatar;
}


function updateTokens(){

    players.forEach(
        (_,i) =>
            placeToken(i)
    );
}


/* =========================================================
   PANEL
========================================================= */

function updatePanel(){

    const panel =
        document.getElementById(
            "playersPanel"
        );

    panel.innerHTML = "";


    players.forEach(
        (player,i) => {

            const box =
                document.createElement(
                    "div"
                );

            box.className =
                "playerBox";


            if(i===currentPlayer){
                box.classList.add(
                    "active"
                );
            }


            box.innerHTML = `
                <div class="avatar">
                    ${player.avatar}
                </div>

                <div class="playerName">
                    ${escapeHTML(player.name)}
                    ${player.bot ? " 🤖" : ""}
                </div>

                <div class="position">
                    ${player.pos}/100
                </div>
            `;


            panel.appendChild(box);
        }
    );


    if(players.length){

        const player =
            players[currentPlayer];


        document.getElementById(
            "turnAvatar"
        ).textContent =
            player.avatar;


        document.getElementById(
            "turnText"
        ).textContent =
            `Turno de ${player.name}${player.bot ? " 🤖" : ""}`;
    }
}


/* =========================================================
   INICIAR
========================================================= */

function startGame(){

    players = [];


    for(let i=0;i<playerCount;i++){

        const input =
            document.getElementById(
                `name${i}`
            );


        let name =
            input
                ? input.value.trim()
                : "";


        if(!name){
            name =
                `Jugador ${i+1}`;
        }


        players.push({

            name:name,

            avatar:
                avatars[
                    selectedAvatar[i]
                ],

            color:
                colors[i],

            pos:1,

            bot:
                !!botPlayers[i]
        });
    }


    currentPlayer = 0;
    rolling = false;
    gameFinished = false;


    generateMap();
    buildBoard();

    show("game");

    updatePanel();
    updateTokens();


    document.getElementById(
        "dice"
    ).textContent =
        "⚀";


    const first =
        players[0];


    document.getElementById(
        "rollButton"
    ).disabled =
        first.bot;


    document.getElementById(
        "status"
    ).textContent =
        first.bot
            ? "🤖 El bot está pensando..."
            : "🎲 Tira el dado";


    activarFullscreen();


    if(first.bot){

        setTimeout(
            botTurn,
            800
        );
    }
}


/* =========================================================
   MOVER
========================================================= */

async function movePlayer(index,steps){

    const player =
        players[index];


    for(let i=0;i<steps;i++){

        if(player.pos>=100){
            break;
        }


        player.pos++;

        placeToken(index);

        updatePanel();

        await sleep(100);
    }
}


/* =========================================================
   SERPIENTE / ESCALERA
========================================================= */

async function checkConnection(index){

    const player =
        players[index];


    if(ladders[player.pos]){

        const from =
            player.pos;

        const to =
            ladders[player.pos];


        document.getElementById(
            "status"
        ).textContent =
            `🪜 ¡Escalera! ${from} → ${to}`;


        await sleep(450);


        player.pos =
            to;


        placeToken(index);
        updatePanel();


        await sleep(450);

        return;
    }


    if(snakes[player.pos]){

        const from =
            player.pos;

        const to =
            snakes[player.pos];


        document.getElementById(
            "status"
        ).textContent =
            `🐍 ¡SERPIENTE! ${from} → ${to}`;


        await sleep(450);


        player.pos =
            to;


        placeToken(index);
        updatePanel();


        await sleep(500);
    }
}


/* =========================================================
   TIRAR DADO
========================================================= */

async function rollDice(){

    if(
        rolling ||
        gameFinished ||
        !players.length
    ){
        return;
    }


    const player =
        players[currentPlayer];


    if(player.bot){
        return;
    }


    rolling = true;


    document.getElementById(
        "rollButton"
    ).disabled = true;


    const dice =
        document.getElementById(
            "dice"
        );


    for(let i=0;i<10;i++){

        const value =
            random(1,6);

        dice.textContent =
            diceFaces[value-1];

        await sleep(60);
    }


    const value =
        random(1,6);


    dice.textContent =
        diceFaces[value-1];


    document.getElementById(
        "status"
    ).textContent =
        `${player.name} sacó ${value}`;


    await sleep(250);


    await executeMove(
        currentPlayer,
        value
    );
}


/* =========================================================
   EJECUTAR MOVIMIENTO
========================================================= */

async function executeMove(index,value){

    const player =
        players[index];


    const target =
        player.pos+value;


    /* SOBREPASA 100 */

    if(target>100){

        for(let i=0;i<value;i++){

            if(player.pos>1){

                player.pos--;

                placeToken(index);

                updatePanel();

                await sleep(100);
            }
        }


        document.getElementById(
            "status"
        ).textContent =
            `↩️ ${player.name} retrocede`;

    }else{

        await movePlayer(
            index,
            value
        );
    }


    if(player.pos<100){

        await checkConnection(index);
    }


    updatePanel();
    updateTokens();


    if(player.pos===100){

        finishGame(index);

        return;
    }


    rolling = false;

    nextTurn();
}


/* =========================================================
   SIGUIENTE TURNO
========================================================= */

function nextTurn(){

    if(gameFinished){
        return;
    }


    currentPlayer =
        (currentPlayer+1)
        % players.length;


    updatePanel();
    updateTokens();


    const player =
        players[currentPlayer];


    document.getElementById(
        "status"
    ).textContent =
        player.bot
            ? `🤖 ${player.name} está pensando...`
            : `🎲 Turno de ${player.name}`;


    document.getElementById(
        "rollButton"
    ).disabled =
        player.bot;


    if(player.bot){

        setTimeout(
            botTurn,
            700
        );
    }
}


/* =========================================================
   BOT
========================================================= */

async function botTurn(){

    if(
        gameFinished ||
        rolling ||
        !players.length
    ){
        return;
    }


    const player =
        players[currentPlayer];


    if(!player.bot){
        return;
    }


    rolling = true;


    document.getElementById(
        "rollButton"
    ).disabled = true;


    const dice =
        document.getElementById(
            "dice"
        );


    for(let i=0;i<10;i++){

        const value =
            random(1,6);


        dice.textContent =
            diceFaces[value-1];


        await sleep(75);
    }


    const value =
        random(1,6);


    dice.textContent =
        diceFaces[value-1];


    document.getElementById(
        "status"
    ).textContent =
        `🤖 ${player.name} sacó ${value}`;


    await sleep(300);


    await executeMove(
        currentPlayer,
        value
    );
}


/* =========================================================
   GANADOR
========================================================= */

function finishGame(index){

    gameFinished = true;
    rolling = false;


    const player =
        players[index];


    document.getElementById(
        "winTitle"
    ).textContent =
        `🏆 ¡${player.name} ganó!`;


    document.getElementById(
        "winText"
    ).textContent =
        `${player.avatar} llegó exactamente a la casilla 100.`;


    show("win");
}


/* =========================================================
   NUEVO MAPA
========================================================= */

function newMap(){

    if(
        rolling ||
        gameFinished
    ){
        return;
    }


    generateMap();

    buildBoard();

    updateTokens();

    updatePanel();


    document.getElementById(
        "status"
    ).textContent =
        "🔄 ¡Nuevo tablero!";
}


/* =========================================================
   FULLSCREEN
========================================================= */

function activarFullscreen(){

    try{

        if(
            document.documentElement.requestFullscreen &&
            !document.fullscreenElement
        ){

            document.documentElement
                .requestFullscreen()
                .catch(()=>{});
        }

    }catch(e){}
}


/* =========================================================
   INICIO
========================================================= */

createPlayerSetup();

</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070a10">
<title>Serpientes & Escaleras</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#070a10;
    color:white;
    font-family:Arial,sans-serif
}

button,input{
    font:inherit
}

.app{
    width:100%;
    height:100dvh;
    min-height:100dvh;
    margin:0 auto;
    position:relative;
    overflow:hidden;
    background:radial-gradient(circle at 50% -10%,#31456c,#111827 48%,#070a10)
}

.screen{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    width:100%;
    height:100%;
    min-height:0
}

.screen.active{
    display:flex
}

/* =========================
   MENÚ
   ========================= */

#menu{
    padding:max(7px,env(safe-area-inset-top))
            max(7px,env(safe-area-inset-right))
            max(7px,env(safe-area-inset-bottom))
            max(7px,env(safe-area-inset-left));
    overflow-y:auto;
    overflow-x:hidden;
    scrollbar-width:none
}

#menu::-webkit-scrollbar{
    display:none
}

.logo{
    text-align:center;
    flex-shrink:0
}

.logo .emoji{
    font-size:clamp(25px,8vw,32px);
    line-height:1
}

.logo h1{
    margin:3px 0 0;
    font-size:clamp(17px,5.5vw,21px);
    line-height:1.05;
    font-weight:1000
}

.logo p{
    margin:4px 0 7px;
    color:#9eabc0;
    font-size:8px
}

.card{
    width:100%;
    background:#151e2e;
    border:1px solid #2e3b54;
    border-radius:12px;
    padding:7px;
    box-shadow:0 8px 20px #0007
}

.card h2{
    margin:0 0 5px;
    font-size:12px
}

.countOptions{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:4px;
    margin-bottom:6px
}

.countButton{
    height:30px;
    border:1px solid #46536b;
    border-radius:7px;
    background:#202a3d;
    color:white;
    font-size:11px;
    font-weight:1000
}

.countButton.selected{
    background:#ffd84d;
    color:#17120a;
    border-color:#ffd84d
}

.playerSetup{
    display:grid;
    gap:4px
}

.setupPlayer{
    width:100%;
    display:flex;
    align-items:center;
    gap:4px;
    background:#202a3d;
    padding:3px;
    border-radius:7px;
    min-width:0
}

.setupAvatar{
    width:32px;
    height:32px;
    flex:0 0 32px;
    border:0;
    border-radius:7px;
    background:#303d55;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    line-height:1;
    overflow:hidden
}

.nameInput{
    width:clamp(65px,22vw,105px);
    min-width:45px;
    border:0;
    outline:0;
    background:#111827;
    color:white;
    border-radius:6px;
    padding:6px;
    font-size:10px
}

.botButton{
    width:40px;
    height:28px;
    flex:0 0 40px;
    border:1px solid #46536b;
    border-radius:6px;
    background:#29344a;
    color:white;
    font-size:9px;
    font-weight:1000
}

.botButton.active{
    background:#8c5cff;
    border-color:#b89cff
}

.avatarWrap{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    gap:3px
}

.avatarOptions{
    flex:1;
    min-width:0;
    width:100%;
    height:31px;
    display:flex;
    align-items:center;
    gap:4px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:2px 4px;
    scrollbar-width:none;
    -ms-overflow-style:none;
    touch-action:pan-x;
    overscroll-behavior-x:contain;
    -webkit-overflow-scrolling:touch
}

.avatarOptions::-webkit-scrollbar{
    display:none;
    width:0;
    height:0
}

.avatarOption{
    flex:0 0 30px;
    width:30px;
    height:27px;
    border:1px solid #46536b;
    border-radius:6px;
    background:#29344a;
    color:white;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    line-height:1;
    white-space:nowrap;
    overflow:hidden;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif
}

.avatarOption.selected{
    border:2px solid #ffd84d;
    background:#46536b
}

.avatarArrows{
    display:flex;
    gap:2px;
    flex:0 0 auto
}

.avatarArrow{
    width:22px;
    height:27px;
    flex:0 0 22px;
    border:0;
    border-radius:5px;
    background:#394862;
    color:#ffd84d;
    font-size:13px;
    font-weight:1000;
    display:flex;
    align-items:center;
    justify-content:center
}

.avatarArrow:active{
    transform:scale(.9);
    background:#46536b
}

.mainButton{
    width:100%;
    border:0;
    border-radius:8px;
    padding:8px;
    margin-top:5px;
    background:#ffd84d;
    color:#17120a;
    font-size:10px;
    font-weight:1000;
    box-shadow:0 2px 0 #b99520
}

.secondaryButton{
    width:100%;
    border:1px solid #394862;
    border-radius:8px;
    padding:7px;
    margin-top:4px;
    background:#202b41;
    color:white;
    font-size:9px;
    font-weight:900
}

/* =========================
   JUEGO
   ========================= */

#game{
    padding:max(3px,env(safe-area-inset-top))
            max(3px,env(safe-area-inset-right))
            max(3px,env(safe-area-inset-bottom))
            max(3px,env(safe-area-inset-left));
    min-height:0
}

.top{
    width:100%;
    height:31px;
    display:flex;
    align-items:center;
    gap:3px;
    flex:0 0 31px
}

.icon{
    width:29px;
    height:29px;
    flex:0 0 29px;
    border:0;
    border-radius:7px;
    background:#202b41;
    color:white;
    font-size:13px
}

.turn{
    flex:1;
    min-width:0;
    height:29px;
    background:#202b41;
    border-radius:7px;
    display:flex;
    align-items:center;
    gap:4px;
    padding:0 6px;
    font-size:8px;
    font-weight:1000;
    overflow:hidden;
    white-space:nowrap
}

#turnAvatar{
    flex:0 0 auto;
    font-size:12px
}

#turnText{
    overflow:hidden;
    text-overflow:ellipsis
}

#boardArea{
    flex:1 1 auto;
    min-height:0;
    min-width:0;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2px 0
}

#board{
    width:min(100%,calc(100dvh - 155px),350px);
    max-width:100%;
    max-height:100%;
    aspect-ratio:1/1;
    position:relative;
    overflow:hidden;
    border-radius:10px;
    background:#e7d09c;
    box-shadow:8px 18px 18px #000b,inset 0 0 0 2px #765e35
}

.cell{
    position:absolute;
    width:10%;
    height:10%;
    padding:1px;
    display:flex;
    align-items:flex-start;
    justify-content:flex-end;
    border:1px solid #927d5055;
    color:#322817;
    font-size:clamp(5px,1.7vw,7px);
    font-weight:1000;
    z-index:1
}

.cell:nth-child(odd){
    background:#fff1c7
}

.cell:nth-child(even){
    background:#e5cc94
}

.start{
    background:#92e39a!important
}

.finish{
    background:#ffd84d!important
}

.connections{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:5;
    pointer-events:none
}

.token{
    position:absolute;
    width:6.5%;
    height:6.5%;
    max-width:22px;
    max-height:22px;
    min-width:12px;
    min-height:12px;
    border:1.5px solid white;
    border-radius:50%;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(7px,2.8vw,11px);
    line-height:1;
    box-shadow:0 3px 5px #000b,inset 0 0 5px #fff8;
    transform:translate(-50%,-50%);
    transition:left .1s linear,top .1s linear
}

.bottom{
    width:100%;
    flex:0 0 auto;
    background:#151e2e;
    border:1px solid #2e3b54;
    border-radius:10px;
    padding:3px
}

.players{
    width:100%;
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:2px
}

.playerBox{
    min-width:0;
    background:#202a3d;
    border:1px solid transparent;
    border-radius:6px;
    padding:2px;
    text-align:center
}

.playerBox.active{
    border-color:#ffd84d
}

.avatar{
    font-size:11px;
    line-height:12px
}

.playerName{
    font-size:6px;
    line-height:7px;
    font-weight:1000;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis
}

.position{
    color:#98a5bb;
    font-size:5px;
    line-height:6px
}

.controls{
    display:flex;
    gap:3px;
    margin-top:3px
}

.dice{
    width:37px;
    height:37px;
    flex:0 0 37px;
    border-radius:8px;
    background:white;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
    box-shadow:0 2px 0 #aeb3bd
}

.roll{
    flex:1;
    margin:0;
    padding:7px;
    font-size:10px
}

.status{
    height:10px;
    margin-top:1px;
    text-align:center;
    color:#aeb9cc;
    font-size:7px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis
}

/* =========================
   GANADOR
   ========================= */

#win{
    align-items:center;
    justify-content:center;
    padding:15px;
    text-align:center
}

.trophy{
    font-size:55px;
    animation:bounce 1s infinite alternate
}

@keyframes bounce{
    from{transform:translateY(0)}
    to{transform:translateY(-8px)}
}

.winTitle{
    font-size:24px;
    font-weight:1000;
    margin:5px 0
}

.winText{
    color:#aeb9cc;
    font-size:10px
}

.winButtons{
    width:100%;
    max-width:280px;
    margin-top:8px
}

@media(max-height:600px){

    .logo .emoji{
        font-size:24px
    }

    .logo h1{
        font-size:17px
    }

    .logo p{
        margin:2px 0 4px
    }

    .card{
        padding:5px
    }

    .setupPlayer{
        padding:2px
    }

    .setupAvatar{
        width:29px;
        height:29px;
        flex-basis:29px;
        font-size:16px
    }

    .avatarOptions{
        height:28px
    }

    .avatarOption{
        width:28px;
        height:24px;
        flex-basis:28px;
        font-size:15px
    }

    .avatarArrow{
        height:24px;
        width:20px;
        flex-basis:20px
    }

    .mainButton{
        padding:6px
    }

    .secondaryButton{
        padding:5px
    }
}

@media(min-width:500px){

    .app{
        max-width:390px
    }

}
</style>
</head>

<body>

<div class="app">

<!-- =========================
     MENÚ
     ========================= -->

<section id="menu" class="screen active">

    <div class="logo">

        <div class="emoji">
            🐍🪜
        </div>

        <h1>
            Serpientes & Escaleras
        </h1>

        <p>
            El clásico juego donde una serpiente arruina tus planes.
        </p>

    </div>


    <div class="card">

        <h2>
            👥 Jugadores
        </h2>


        <div class="countOptions">

            <button
                class="countButton selected"
                data-count="2">
                2
            </button>

            <button
                class="countButton"
                data-count="3">
                3
            </button>

            <button
                class="countButton"
                data-count="4">
                4
            </button>

            <button
                class="countButton"
                data-count="5">
                5
            </button>

        </div>


        <div
            id="playerSetup"
            class="playerSetup">
        </div>


        <button
            id="startButton"
            class="mainButton">

            🎲 EMPEZAR PARTIDA

        </button>


        <button
            id="fullscreenButton"
            class="secondaryButton">

            ⛶ PANTALLA COMPLETA

        </button>

    </div>

</section>


<!-- =========================
     JUEGO
     ========================= -->

<section id="game" class="screen">

    <div class="top">

        <button
            id="backMenu"
            class="icon">

            ☰

        </button>


        <div class="turn">

            <span id="turnAvatar">
                😀
            </span>

            <span id="turnText">
                Turno
            </span>

        </div>


        <button
            id="newMapButton"
            class="icon">

            🔄

        </button>

    </div>


    <div id="boardArea">

        <div id="board"></div>

    </div>


    <div class="bottom">

        <div
            id="playersPanel"
            class="players">
        </div>


        <div class="controls">

            <div
                id="dice"
                class="dice">

                ⚀

            </div>


            <button
                id="rollButton"
                class="mainButton roll">

                🎲 TIRAR DADO

            </button>

        </div>


        <div
            id="status"
            class="status">

            ¡Que empiece la partida!

        </div>

    </div>

</section>


<!-- =========================
     GANADOR
     ========================= -->

<section id="win" class="screen">

    <div class="trophy">
        🏆
    </div>


    <div
        id="winTitle"
        class="winTitle">

        ¡Ganaste!

    </div>


    <div
        id="winText"
        class="winText">

        Llegaste al 100.

    </div>


    <div class="winButtons">

        <button
            id="playAgain"
            class="mainButton">

            🎲 JUGAR OTRA VEZ

        </button>


        <button
            id="winMenu"
            class="secondaryButton">

            🏠 VOLVER AL MENÚ

        </button>

    </div>

</section>

</div>


<script>

/* =========================
   CONFIGURACIÓN
   ========================= */

const colors=[
    "#ff5368",
    "#54a7ff",
    "#8be35c",
    "#b46cff",
    "#ff9f43"
];


const avatars=[

"😀","😃","😄","😁","😆","😅","😂","🤣",
"😊","😇","🙂","🙃","😉","😌","😍","🥰",
"😘","😗","😙","😚","😋","😛","😝","😜",
"🤪","🤨","🧐","🤓","😎","🤩","🥳","😏",
"😒","😞","😔","😟","😕","🙁","☹️","😣",
"😖","😫","😩","🥺","😢","😭","😤","😠",
"😡","🤬","🤯","😳","🥵","🥶","😱","😨",
"😰","😥","😓","🤗","🤔","🫣","🤭","🫢",
"🤫","🤥","😶","🫠","😐","😑","😬","🙄",
"😯","😦","😧","😮","😲","🥱","😴","🤤",
"😪","😵","🤐","🥴","🤢","🤮","🤧","😷",
"🤠","🥸","👻","💀","☠️","👽","👾","🤖",
"🎃","😈","👿","👹","👺","🤡","💩",

"🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼",
"🐨","🐯","🦁","🐮","🐷","🐸","🐵","🙈",
"🙉","🙊","🐒","🐔","🐧","🐦","🐤","🦆",
"🦅","🦉","🐺","🐗","🐴","🦄","🐝","🐛",
"🦋","🐌","🐞","🐜","🪲","🕷️","🦂","🐢",
"🐍","🦎","🦖","🦕","🐙","🦑","🦀","🐠",
"🐟","🐡","🐬","🐳","🦈","🐊","🐘","🦏",
"🦛","🐪","🐫","🦒","🦘","🦬","🐄","🐎",
"🐖","🐑","🦙","🐐","🦌","🐕","🐈","🦮",
"🐕‍🦺","🐈‍⬛","🪽","🦜","🦚","🦩","🦢",
"🦤","🦃",

"🍕","🍔","🍟","🌭","🍿","🍩","🍪","🍫",
"🍎","🍉","🍓","🍌","🍇","🍒","🥝","🥑",
"🍍","🥭","🍊","🍋","🍈","🍑","🍐","🍏",

"⚽","🏀","🏈","⚾","🎾","🏐","🎱","🏆",
"🎮","🕹️","🎲","🎯","🎳","🏹","🥊","🥋",

"🚗","🏎️","🚕","🚌","🚓","🚑","🚒","🚜",
"🚀","✈️","🚁","🚢","🚂","🚲","🛵","🛸",

"🔥","⭐","🌟","💎","💥","⚡","🌈","☀️",
"🌙","🌪️","❄️","☁️","🌊","🌋","🌎",

"👑","🎩","🕶️","🥷","🧙","🧛","🧟","🧞",
"🧜","🦸","🦹","👮","🕵️","👨‍🚀","💪",
"👀","👋","👍","👎","👏","🙌","🤝","✌️",

"❤️","🧡","💛","💚","💙","💜","🖤","🤍",
"🤎","💖","💗","💓","💞","💕","💯","✨"

];


let selectedAvatar=[
    0,1,2,3,4
];

let botPlayers=[
    false,
    false,
    false,
    false,
    false
];

let playerCount=2;

let players=[];

let ladders={};

let snakes={};

let currentPlayer=0;

let rolling=false;

let gameFinished=false;


/* =========================
   UTILIDADES
   ========================= */

function sleep(ms){

    return new Promise(
        resolve=>setTimeout(resolve,ms)
    );

}


function random(min,max){

    return Math.floor(
        Math.random()*(max-min+1)
    )+min;

}


function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   PANTALLAS
   ========================= */

function showScreen(id){

    document
    .querySelectorAll(".screen")
    .forEach(screen=>{
        screen.classList.remove("active");
    });


    document
    .getElementById(id)
    .classList.add("active");

}


/* =========================
   JUGADORES
   ========================= */

document
.querySelectorAll(".countButton")
.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            playerCount=
                Number(button.dataset.count);


            document
            .querySelectorAll(".countButton")
            .forEach(x=>{
                x.classList.remove(
                    "selected"
                );
            });


            button.classList.add(
                "selected"
            );


            createPlayerSetup();

        }
    );

});


function createPlayerSetup(){

    const container=
        document.getElementById(
            "playerSetup"
        );


    container.innerHTML="";


    for(let i=0;i<playerCount;i++){

        const row=
            document.createElement("div");

        row.className="setupPlayer";


        const avatar=
            document.createElement("button");

        avatar.className="setupAvatar";

        avatar.type="button";

        avatar.textContent=
            avatars[
                selectedAvatar[i]
            ];


        const input=
            document.createElement("input");

        input.className="nameInput";

        input.placeholder=
            `Jugador ${i+1}`;

        input.maxLength=12;

        input.value=
            `Jugador ${i+1}`;


        const bot=
            document.createElement("button");

        bot.className="botButton";

        bot.type="button";

        bot.textContent=
            botPlayers[i]
            ?"BOT"
            :"HUM";


        if(botPlayers[i]){
            bot.classList.add("active");
        }


        bot.addEventListener(
            "click",
            ()=>{

                botPlayers[i]=
                    !botPlayers[i];


                bot.textContent=
                    botPlayers[i]
                    ?"BOT"
                    :"HUM";


                bot.classList.toggle(
                    "active",
                    botPlayers[i]
                );

            }
        );


        const avatarWrap=
            document.createElement("div");

        avatarWrap.className=
            "avatarWrap";


        const options=
            document.createElement("div");

        options.className=
            "avatarOptions";


        avatars.forEach(
            (emoji,a)=>{

                const option=
                    document.createElement(
                        "button"
                    );


                option.type="button";

                option.className=
                    "avatarOption";

                option.textContent=emoji;


                if(
                    selectedAvatar[i]===a
                ){

                    option.classList.add(
                        "selected"
                    );

                }


                option.addEventListener(
                    "click",
                    ()=>{

                        selectedAvatar[i]=a;

                        avatar.textContent=
                            avatars[a];


                        options
                        .querySelectorAll(
                            ".avatarOption"

/* =========================
   TABLERO
   ========================= */

function getRow(cell){

    return Math.floor(
        (cell-1)/10
    );

}


function getCol(cell){

    const row=getRow(cell);

    const pos=
        (cell-1)%10;


    return row%2===0
        ?pos
        :9-pos;

}


/* =========================
   MAPA
   ========================= */

function generateMap(){

    ladders={};

    snakes={};


    let attempts=0;


    /*
       ESCALERAS

       REGLAS:
       - 5 escaleras
       - nunca llegan a 100
       - mínimo 8 casillas
       - no misma fila
       - no misma columna
       - mínimo 2 columnas de diferencia
       - mínimo 2 filas de diferencia
       - por lo tanto no pueden quedar horizontales
    */

    while(
        Object.keys(ladders).length<5 &&
        attempts<5000
    ){

        attempts++;


        const from=
            random(2,85);


        const to=
            random(from+8,99);


        if(to<=from)continue;

        if(to===100)continue;

        if(
            Math.abs(to-from)<8
        )continue;


        const fromCol=
            getCol(from);

        const toCol=
            getCol(to);


        const fromRow=
            getRow(from);

        const toRow=
            getRow(to);


        /*
           NUNCA HORIZONTAL
        */

        if(fromRow===toRow)
            continue;


        /*
           NUNCA VERTICAL
        */

        if(fromCol===toCol)
            continue;


        /*
           EVITAR CASI HORIZONTAL
        */

        if(
            Math.abs(fromCol-toCol)<2
        )
            continue;


        /*
           DEBE TENER SUFICIENTE
           DIFERENCIA VERTICAL
        */

        if(
            Math.abs(fromRow-toRow)<2
        )
            continue;


        const values=[

            ...Object.keys(ladders)
                .map(Number),

            ...Object.values(ladders)
                .map(Number),

            ...Object.keys(snakes)
                .map(Number),

            ...Object.values(snakes)
                .map(Number)

        ];


        if(values.includes(from))
            continue;


        if(values.includes(to))
            continue;


        ladders[from]=to;

    }


    /*
       SERPIENTES
    */

    attempts=0;


    while(
        Object.keys(snakes).length<6 &&
        attempts<5000
    ){

        attempts++;


        const from=
            random(15,99);


        const to=
            random(2,from-8);


        if(from<=to)
            continue;


        if(from===100)
            continue;


        if(
            Math.abs(from-to)<8
        )
            continue;


        const fromCol=
            getCol(from);

        const toCol=
            getCol(to);


        const fromRow=
            getRow(from);

        const toRow=
            getRow(to);


        if(fromRow===toRow)
            continue;


        if(fromCol===toCol)
            continue;


        if(
            Math.abs(fromCol-toCol)<2
        )
            continue;


        if(
            Math.abs(fromRow-toRow)<2
        )
            continue;


        const values=[

            ...Object.keys(ladders)
                .map(Number),

            ...Object.values(ladders)
                .map(Number),

            ...Object.keys(snakes)
                .map(Number),

            ...Object.values(snakes)
                .map(Number)

        ];


        if(values.includes(from))
            continue;


        if(values.includes(to))
            continue;


        snakes[from]=to;

    }


    /*
       RESPALDO
    */

    if(
        Object.keys(ladders).length<5
    ){

        ladders={

            4:14,
            9:31,
            20:38,
            28:54,
            51:72

        };

    }


    if(
        Object.keys(snakes).length<6
    ){

        snakes={

            17:7,
            36:16,
            48:26,
            62:43,
            79:59,
            96:74

        };

    }

}


/* =========================
   POSICIONES
   ========================= */

function cellPosition(cell){

    const row=
        getRow(cell);

    const col=
        getCol(cell);


    return{

        x:col*10+5,

        y:(9-row)*10+5

    };

}


/* =========================
   TABLERO
   ========================= */

function buildBoard(){

    const board=
        document.getElementById(
            "board"
        );


    board.innerHTML="";


    for(let n=1;n<=100;n++){

        const cell=
            document.createElement(
                "div"
            );


        cell.className="cell";


        if(n===1){

            cell.classList.add(
                "start"
            );

        }


        if(n===100){

            cell.classList.add(
                "finish"
            );

        }


        const p=
            cellPosition(n);


        cell.style.left=
            (p.x-5)+"%";


        cell.style.top=
            (p.y-5)+"%";


        cell.textContent=n;


        board.appendChild(
            cell
        );

    }


    const svg=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
        );


    svg.classList.add(
        "connections"
    );


    svg.setAttribute(
        "viewBox",
        "0 0 100 100"
    );


    board.appendChild(
        svg
    );


    Object.entries(ladders)
    .forEach(([from,to])=>{

        drawLadder(
            svg,
            Number(from),
            Number(to)
        );

    });


    Object.entries(snakes)
    .forEach(([from,to])=>{

        drawSnake(
            svg,
            Number(from),
            Number(to)
        );

    });


    players.forEach(
        (player,i)=>{

            const token=
                document.createElement(
                    "div"
                );


            token.className="token";

            token.id=
                `token-${i}`;


            token.style.background=
                colors[i];


            token.textContent=
                player.avatar;


            board.appendChild(
                token
            );

        }
    );


    updateTokens();

}


/* =========================
   DIBUJAR ESCALERA
   ========================= */

function drawLadder(
    svg,
    from,
    to
){

    const a=
        cellPosition(from);

    const b=
        cellPosition(to);


    const dx=
        b.x-a.x;

    const dy=
        b.y-a.y;


    const length=
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    if(!length)return;


    const nx=
        -dy/length*1.2;

    const ny=
        dx/length*1.2;


    const rails=[

        [
            a.x+nx,
            a.y+ny,
            b.x+nx,
            b.y+ny
        ],

        [
            a.x-nx,
            a.y-ny,
            b.x-nx,
            b.y-ny
        ]

    ];


    rails.forEach(
        r=>{

            const line=
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );


            line.setAttribute(
                "x1",
                r[0]
            );

            line.setAttribute(
                "y1",
                r[1]
            );

            line.setAttribute(
                "x2",
                r[2]
            );

            line.setAttribute(
                "y2",
                r[3]
            );


            line.setAttribute(
                "stroke",
                "#754b18"
            );

            line.setAttribute(
                "stroke-width",
                "1.4"
            );

            line.setAttribute(
                "stroke-linecap",
                "round"
            );


            svg.appendChild(
                line
            );

        }
    );


    const rungs=
        Math.max(
            3,
            Math.floor(length/7)
        );


    for(
        let i=1;
        i<rungs;
        i++
    ){

        const t=i/rungs;


        const cx=
            a.x+dx*t;

        const cy=
            a.y+dy*t;


        const rung=
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );


        rung.setAttribute(
            "x1",
            cx+nx
        );

        rung.setAttribute(
            "y1",
            cy+ny
        );

        rung.setAttribute(
            "x2",
            cx-nx
        );

        rung.setAttribute(
            "y2",
            cy-ny
        );


        rung.setAttribute(
            "stroke",
            "#a96d21"
        );

        rung.setAttribute(
            "stroke-width",
            "1"
        );

        rung.setAttribute(
            "stroke-linecap",
            "round"
        );


        svg.appendChild(
            rung
        );

    }

}


/* =========================
   DIBUJAR SERPIENTE
   ========================= */

function drawSnake(
    svg,
    from,
    to
){

    const a=
        cellPosition(from);

    const b=
        cellPosition(to);


    const dx=
        b.x-a.x;

    const dy=
        b.y-a.y;


    const distance=
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    const steps=
        Math.max(
            8,
            Math.floor(
                distance/3
            )
        );


    const points=[];


    const nx=
        -dy/distance;

    const ny=
        dx/distance;


    const amplitude=
        Math.min(
            1.5,
            Math.max(
                .7,
                distance/22
            )
        );


    for(
        let i=0;
        i<=steps;
        i++
    ){

        const t=i/steps;


        const wave=
            Math.sin(
                t*Math.PI*4
            )*
            amplitude;


        points.push({

            x:
                a.x+
                dx*t+
                nx*wave,

            y:
                a.y+
                dy*t+
                ny*wave

        });

    }


    const shadow=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polyline"
        );


    shadow.setAttribute(
        "points",
        points
        .map(
            p=>
                `${p.x+.35},${p.y+.55}`
        )
        .join(" ")
    );


    shadow.setAttribute(
        "fill",
        "none"
    );


    shadow.setAttribute(
        "stroke",
        "#0008"
    );


    shadow.setAttribute(
        "stroke-width",
        "2.5"
    );


    shadow.setAttribute(
        "stroke-linecap",
        "round"
    );


    shadow.setAttribute(
        "stroke-linejoin",
        "round"
    );


    svg.appendChild(
        shadow
    );


    const body=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polyline"
        );


    body.setAttribute(
        "points",
        points
        .map(
            p=>
                `${p.x},${p.y}`
        )
        .join(" ")
    );


    body.setAttribute(
        "fill",
        "none"
    );


    body.setAttribute(
        "stroke",
        "#24732e"
    );


    body.setAttribute(
        "stroke-width",
        "1.8"
    );


    body.setAttribute(
        "stroke-linecap",
        "round"
    );


    body.setAttribute(
        "stroke-linejoin",
        "round"
    );


    svg.appendChild(
        body
    );


    const highlight=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polyline"
        );


    highlight.setAttribute(
        "points",
        points
        .map(
            p=>
                `${p.x-.25},${p.y-.3}`
        )
        .join(" ")
    );


    highlight.setAttribute(
        "fill",
        "none"
    );


    highlight.setAttribute(
        "stroke",
        "#54a84c"
    );


    highlight.setAttribute(
        "stroke-width",
        ".5"
    );


    highlight.setAttribute(
        "stroke-linecap",
        "round"
    );


    svg.appendChild(
        highlight
    );


    const head=
        points[
            points.length-1
        ];


    const headCircle=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );


    headCircle.setAttribute(
        "cx",
        head.x
    );


    headCircle.setAttribute(
        "cy",
        head.y
    );


    headCircle.setAttribute(
        "r",
        "1.7"
    );


    headCircle.setAttribute(
        "fill",
        "#24732e"
    );


    headCircle.setAttribute(
        "stroke",
        "#163d1b"
    );


    headCircle.setAttribute(
        "stroke-width",
        ".35"
    );


    svg.appendChild(
        headCircle
    );


    const eye1=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );


    eye1.setAttribute(
        "cx",
        head.x-.55
    );


    eye1.setAttribute(
        "cy",
        head.y-.55
    );


    eye1.setAttribute(
        "r",
        ".45"
    );


    eye1.setAttribute(
        "fill",
        "white"
    );


    svg.appendChild(
        eye1
    );


    const eye2=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );


    eye2.setAttribute(
        "cx",
        head.x+.55
    );


    eye2.setAttribute(
        "cy",
        head.y-.55
    );


    eye2.setAttribute(
        "r",
        ".45"
    );


    eye2.setAttribute(
        "fill",
        "white"
    );


    svg.appendChild(
        eye2
    );


    const pupil1=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );


    pupil1.setAttribute(
        "cx",
        head.x-.55
    );


    pupil1.setAttribute(
        "cy",
        head.y-.55
    );


    pupil1.setAttribute(
        "r",
        ".2"
    );


    pupil1.setAttribute(
        "fill",
        "black"
    );


    svg.appendChild(
        pupil1
    );


    const pupil2=

    );


    tongue.setAttribute(

    );

    const fork=

            "line"
        );


    fork.setAttribute(
        "x1",
        head.x
    );


    fork.setAttribute(
        "y1",
        head.y+2.2
    );


    fork.setAttribute(
        "x2",
        head.x+.7
    );


    fork.setAttribute(
        "y2",
        head.y+3
    );


    fork.setAttribute(

    );

function placeToken(index){

    const player=
        players[index];


    const pos=
        cellPosition(
            player.position
        );


    const token=
        document.getElementById(
            `token-${index}`
        );


    if(!token)return;


    token.style.left=
        pos.x+"%";


    token.style.top=
        pos.y+"%";


    token.style.transform=
        "translate(-50%,-50%)";

}


function updateTokens(){

    players.forEach(
        (_,i)=>{
            placeToken(i);
        }
    );

}

function startGame(){

        document.querySelectorAll(
            ".setupPlayer"
        );


    players=[];


    rows.forEach(
        (row,i)=>{

            const input=
                row.querySelector(
                    ".nameInput"
                );


            let name=
                input.value.trim();


            if(!name){

                name=
                    `Jugador ${i+1}`;

            }


            players.push({

                name:name,

                avatar:
                    avatars[
                        selectedAvatar[i]
                    ],

                position:1,

                bot:
                    botPlayers[i]

            });

        }
    );


    currentPlayer=0;

    rolling=false;

    gameFinished=false;


    generateMap();

    buildBoard();


    showScreen("game");


    updatePanel();

    updateTurn();


    activarFullscreen();


    if(
        players[0].bot
    ){

        setTimeout(
            ()=>{
                botTurn();
            },
            500
        );

    }

function updateTurn(){

    if(
        !players[currentPlayer]
    ){
        return;
    }


    document
    .getElementById(
        "turnAvatar"
    )
    .textContent=
        players[
            currentPlayer
        ].avatar;


    document
    .getElementById(
        "turnText"
    )
    .textContent=
        `Turno de ${
            players[
                currentPlayer
            ].name
        }`;


    const rollButton=
        document.getElementById(
            "rollButton"
        );


    rollButton.disabled=
        rolling||
        gameFinished||
        players[
            currentPlayer
        ].bot;


    rollButton.style.opacity=
        rollButton.disabled
        ?".5"
        :"1";


    updatePanel();

}


/* =========================
   MOVIMIENTO
   ========================= */

async function movePlayer(
    index,
    steps
){

    const player=
        players[index];


    const direction=
        steps>=0
        ?1
        :-1;


    for(
        let i=0;
        i<Math.abs(steps);
        i++
    ){

        player.position+=
            direction;


        if(
            player.position<1
        ){

            player.position=1;

        }


        if(
            player.position>100
        ){

            player.position=100;

        }


        updateTokens();

        updatePanel();


        /*
           100 ms por casilla
        */

        await sleep(100);

    }

}


/* =========================
   ESCALERA / SERPIENTE
   ========================= */

async function checkConnection(
    index
){

    const player=
        players[index];


    /* ESCALERA */

    if(
        ladders[
            player.position
        ]
    ){

        const from=
            player.position;

        const to=
            ladders[from];


        document
        .getElementById(
            "status"
        )
        .textContent=
            `🪜 ${player.name} está subiendo...`;


        const steps=12;


        for(
            let i=1;
            i<=steps;
            i++
        ){

            const t=
                i/steps;


            const smooth=
                t*t*(3-2*t);


            player.position=
                Math.round(
                    from+
                    (to-from)*
                    smooth
                );


            updateTokens();

            updatePanel();


            await sleep(50);

        }


        player.position=to;


        updateTokens();

        updatePanel();


        await sleep(100);


        document
        .getElementById(
            "status"
        )
        .textContent=
            `🪜 ¡${player.name} subió la escalera!`;


        return true;

    }


    /* SERPIENTE */

    if(
        snakes[
            player.position
        ]
    ){

        const from=
            player.position;

        const to=
            snakes[from];


        document
        .getElementById(
            "status"
        )
        .textContent=
            `🐍 ¡${player.name} cayó por la serpiente!`;


        const steps=12;


        for(
            let i=1;
            i<=steps;
            i++
        ){

            const t=
                i/steps;


            const smooth=
                t*t;


            player.position=
                Math.round(
                    from+
                    (to-from)*
                    smooth
                );


            updateTokens();

            updatePanel();


            await sleep(45);

        }


        player.position=to;


        updateTokens();

        updatePanel();


        await sleep(100);


        document
        .getElementById(
            "status"
        )
        .textContent=
            `🐍 ${player.name} terminó en ${to}.`;


        return true;

    }


    return false;

}


/* =========================
   DADO
   ========================= */

const diceFaces=[
    "⚀",
    "⚁",
    "⚂",
    "⚃",
    "⚄",
    "⚅"
];


async function animateDice(){

    const dice=
        document.getElementById(
            "dice"
        );


    for(
        let i=0;
        i<8;
        i++
    ){

        const value=
            random(1,6);


        dice.textContent=
            diceFaces[
                value-1
            ];


        await sleep(45);

    }

}


/* =========================
   TIRADA HUMANA
   ========================= */

document
.getElementById("rollButton")
.addEventListener(
    "click",
    rollDice
);


async function rollDice(){

    if(
        rolling||
        gameFinished||
        players[
            currentPlayer
        ].bot
    ){

        return;

    }


    rolling=true;


    updateTurn();


    document
    .getElementById(
        "status"
    )
    .textContent=
        `${players[
            currentPlayer
        ].name} está tirando...`;


    await animateDice();


    const value=
        random(1,6);


    document
    .getElementById(
        "dice"
    )
    .textContent=
        diceFaces[
            value-1
        ];


    await executeMove(
        currentPlayer,
        value
    );

}


/* =========================
   EJECUTAR MOVIMIENTO
   ========================= */

async function executeMove(
    index,
    value
){

    const player=
        players[index];


    document
    .getElementById(
        "status"
    )
    .textContent=
        `${player.name} sacó ${value}.`;


    await sleep(100);


    const target=
        player.position+
        value;


    /* LLEGA EXACTAMENTE A 100 */

    if(
        target===100
    ){

        await movePlayer(
            index,
            value
        );


        await sleep(150);


        finishGame(index);

        return;

    }


    /* SE PASA DE 100 */

    if(
        target>100
    ){

        const overshoot=
            target-100;


        const forward=
            100-player.position;


        if(forward>0){

            await movePlayer(
                index,
                forward
            );

        }


        await movePlayer(
            index,
            -overshoot
        );


        document
        .getElementById(
            "status"
        )
        .textContent=
            `${player.name} se pasó y retrocede ${overshoot}.`;

    }

    else{

        await movePlayer(
            index,
            value
        );

    }


    await checkConnection(
        index
    );


    await sleep(100);


    nextTurn();

}


/* =========================
   SIGUIENTE TURNO
   ========================= */

function nextTurn(){

    if(gameFinished)
        return;


    currentPlayer=
        (
            currentPlayer+1
        )%
        players.length;


    rolling=false;


    updateTurn();


    if(
        players[
            currentPlayer
        ].bot
    ){

        setTimeout(
            ()=>{
                botTurn();
            },
            450
        );

    }

    else{

        document
        .getElementById(
            "status"
        )
        .textContent=
            `🎲 Turno de ${
                players[
                    currentPlayer
                ].name
            }`;

    }

}


/* =========================
   BOT
   ========================= */

async function botTurn(){

    if(
        rolling||
        gameFinished||
        !players[
            currentPlayer
        ].bot
    ){

        return;

    }


    rolling=true;


    updateTurn();


    const player=
        players[
            currentPlayer
        ];


    document
    .getElementById(
        "status"
    )
    .textContent=
        `🤖 ${player.name} está pensando...`;


    await sleep(250);


    await animateDice();


    const value=
        random(1,6);


    document
    .getElementById(
        "dice"
    )
    .textContent=
        diceFaces[
            value-1
        ];


    await executeMove(
        currentPlayer,
        value
    );

}


/* =========================
   GANADOR
   ========================= */

function finishGame(index){

    gameFinished=true;

    rolling=false;


    const player=
        players[index];


    document
    .getElementById(
        "winTitle"
    )
    .textContent=
        `🏆 ¡${player.name} ganó!`;


    document
    .getElementById(
        "winText"
    )
    .textContent=
        `${player.avatar} llegó al casillero 100.`;


    showScreen("win");

}


/* =========================
   NUEVO MAPA
   ========================= */

document
.getElementById("newMapButton")
.addEventListener(
    "click",
    ()=>{

        if(
            rolling||
            gameFinished
        ){

            return;

        }


        generateMap();

        buildBoard();


        document
        .getElementById(
            "status"
        )
        .textContent=
            "🔄 ¡Nuevo mapa generado!";

    }
);


/* =========================
   VOLVER AL MENÚ
   ========================= */

document
.getElementById("backMenu")
.addEventListener(
    "click",
    ()=>{

        if(rolling)
            return;


        showScreen("menu");

    }
);


document
.getElementById("winMenu")
.addEventListener(
    "click",
    ()=>{

        showScreen("menu");

    }
);


/* =========================
   OTRA PARTIDA
   ========================= */

document
.getElementById("playAgain")
.addEventListener(
    "click",
    ()=>{

        players.forEach(
            player=>{
                player.position=1;
            }
        );


        currentPlayer=0;

        rolling=false;

        gameFinished=false;


        generateMap();

        buildBoard();


        showScreen("game");


        updatePanel();

        updateTurn();


        document
        .getElementById(
            "status"
        )
        .textContent=
            "🎲 ¡Nueva partida!";


        if(
            players[0].bot
        ){

            setTimeout(
                ()=>{
                    botTurn();
                },
                500
            );

        }

    }
);


/* =========================
   PANTALLA COMPLETA
   ========================= */

document
.getElementById(
    "fullscreenButton"
)
.addEventListener(
    "click",
    activarFullscreen
);


async function activarFullscreen(){

    try{

        if(
            !document.fullscreenElement &&
            document
            .documentElement
            .requestFullscreen
        ){

            await document
            .documentElement
            .requestFullscreen();

        }

    }
    catch(e){}

}


/* =========================
   ARRANQUE
   ========================= */

createPlayerSetup();

</script>

</html>

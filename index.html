<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#080b14">

<title>COMESERPIENTES</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080b14;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overscroll-behavior:none;
}

button,input{
    font:inherit;
}

.app{
    position:relative;
    width:100%;
    height:100dvh;
    min-height:100dvh;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% -15%,
            #415b91 0%,
            #1c2944 30%,
            #0d1422 62%,
            #070a11 100%
        );
}

/* =========================
   PANTALLAS
========================= */

.screen{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    display:none;
    flex-direction:column;

    min-height:0;
}

.screen.active{
    display:flex;
}

/* =========================
   MENÚ
========================= */

#menu{
    padding:
        max(10px,env(safe-area-inset-top))
        max(10px,env(safe-area-inset-right))
        max(10px,env(safe-area-inset-bottom))
        max(10px,env(safe-area-inset-left));

    overflow-y:auto;
    overflow-x:hidden;

    scrollbar-width:none;
}

#menu::-webkit-scrollbar{
    display:none;
}

.logo{
    text-align:center;
    flex-shrink:0;

    padding-top:2px;
    padding-bottom:8px;
}

.logo .emoji{
    font-size:clamp(34px,10vw,52px);

    filter:
        drop-shadow(0 5px 5px #0008);
}

.logo h1{
    margin:4px 0 0;

    font-size:
        clamp(25px,8vw,38px);

    line-height:1;

    font-weight:1000;

    letter-spacing:1px;

    background:
        linear-gradient(
            180deg,
            #fff8b0,
            #ffd84d 45%,
            #d89b18
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    text-shadow:
        0 4px 10px #0008;
}

.logo p{
    margin:7px 0 0;

    color:#aebbd2;

    font-size:10px;
}

/* =========================
   TARJETA
========================= */

.card{
    width:100%;

    background:
        linear-gradient(
            145deg,
            #1c2940,
            #111a2a
        );

    border:
        1px solid #506080;

    border-radius:18px;

    padding:10px;

    box-shadow:
        0 15px 35px #0009,
        inset 0 1px 0 #ffffff14;
}

.card h2{
    margin:0 0 7px;

    font-size:13px;

    color:#f7f9ff;
}

/* =========================
   JUGADORES
========================= */

.countOptions{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:5px;

    margin-bottom:7px;
}

.countButton{
    height:34px;

    border:
        1px solid #4d5c79;

    border-radius:9px;

    background:
        linear-gradient(
            180deg,
            #293650,
            #1b2538
        );

    color:white;

    font-size:12px;

    font-weight:1000;

    box-shadow:
        inset 0 1px 0 #ffffff12;
}

.countButton:active{
    transform:scale(.96);
}

.countButton.selected{
    background:
        linear-gradient(
            180deg,
            #fff078,
            #ffd84d,
            #dba928
        );

    color:#17120a;

    border-color:#ffe98b;

    box-shadow:
        0 3px 0 #a67919,
        0 5px 12px #ffd84d44;
}

.playerSetup{
    display:grid;
    gap:5px;
}

.setupPlayer{
    width:100%;

    display:flex;
    align-items:center;

    gap:5px;

    background:
        linear-gradient(
            180deg,
            #26344e,
            #1d293e
        );

    border:
        1px solid #354664;

    padding:4px;

    border-radius:10px;

    min-width:0;

    box-shadow:
        inset 0 1px 0 #ffffff0c;
}

.setupAvatar{
    width:35px;
    height:35px;

    flex:0 0 35px;

    border:0;

    border-radius:9px;

    background:
        radial-gradient(
            circle at 35% 25%,
            #4c5e7d,
            #273650
        );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;

    box-shadow:
        inset 0 1px 0 #ffffff18,
        0 3px 5px #0006;
}

.nameInput{
    width:clamp(
        65px,
        22vw,
        105px
    );

    min-width:45px;

    border:
        1px solid #3c4b67;

    outline:0;

    background:#101827;

    color:white;

    border-radius:8px;

    padding:7px;

    font-size:10px;
}

.nameInput:focus{
    border-color:#ffd84d;
}

.botButton{
    width:42px;
    height:29px;

    flex:0 0 42px;

    border:
        1px solid #4b5a75;

    border-radius:7px;

    background:#293650;

    color:white;

    font-size:9px;

    font-weight:1000;
}

.botButton.active{
    background:
        linear-gradient(
            180deg,
            #a27aff,
            #7347d8
        );

    border-color:#c5aaff;

    box-shadow:
        0 0 10px #8c5cff55;
}

.avatarWrap{
    flex:1;
    min-width:0;

    display:flex;
    align-items:center;

    gap:3px;
}

.avatarOptions{
    flex:1;
    min-width:0;

    height:32px;

    display:flex;
    align-items:center;

    gap:4px;

    overflow-x:auto;
    overflow-y:hidden;

    padding:2px 4px;

    scrollbar-width:none;

    touch-action:pan-x;

    overscroll-behavior-x:contain;

    -webkit-overflow-scrolling:touch;
}

.avatarOptions::-webkit-scrollbar{
    display:none;
}

.avatarOption{
    flex:0 0 30px;

    width:30px;
    height:28px;

    border:
        1px solid #485876;

    border-radius:7px;

    background:#293750;

    color:white;

    padding:0;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:17px;

    line-height:1;

    white-space:nowrap;
}

.avatarOption.selected{
    border:
        2px solid #ffd84d;

    background:#455676;

    box-shadow:
        0 0 8px #ffd84d44;
}

.avatarArrows{
    display:flex;
    gap:2px;

    flex:0 0 auto;
}

.avatarArrow{
    width:23px;
    height:28px;

    flex:0 0 23px;

    border:0;

    border-radius:6px;

    background:#3b4a65;

    color:#ffd84d;

    font-size:13px;

    font-weight:1000;
}

.avatarArrow:active{
    transform:scale(.9);
}

/* =========================
   BOTONES
========================= */

.mainButton{
    width:100%;

    border:0;

    border-radius:10px;

    padding:10px;

    margin-top:6px;

    background:
        linear-gradient(
            180deg,
            #fff07b,
            #ffd84d 50%,
            #dda92a
        );

    color:#17120a;

    font-size:11px;

    font-weight:1000;

    box-shadow:
        0 3px 0 #9d7418,
        0 5px 15px #0005;
}

.mainButton:active{
    transform:translateY(2px);

    box-shadow:
        0 1px 0 #9d7418;
}

.secondaryButton{
    width:100%;

    border:
        1px solid #465675;

    border-radius:9px;

    padding:8px;

    margin-top:5px;

    background:
        linear-gradient(
            180deg,
            #293650,
            #1c273b
        );

    color:white;

    font-size:10px;

    font-weight:900;
}

/* =========================
   JUEGO
========================= */

#game{
    padding:
        max(5px,env(safe-area-inset-top))
        max(5px,env(safe-area-inset-right))
        max(5px,env(safe-area-inset-bottom))
        max(5px,env(safe-area-inset-left));

    min-height:0;
}

/* =========================
   BARRA SUPERIOR
========================= */

.top{
    width:100%;

    height:36px;

    display:flex;
    align-items:center;

    gap:4px;

    flex:0 0 36px;
}

.icon{
    width:33px;
    height:33px;

    flex:0 0 33px;

    border:
        1px solid #40516f;

    border-radius:9px;

    background:
        linear-gradient(
            180deg,
            #293650,
            #1b263a
        );

    color:white;

    font-size:14px;

    box-shadow:
        inset 0 1px 0 #ffffff12;
}

.icon:active{
    transform:scale(.94);
}

.turn{
    flex:1;

    min-width:0;

    height:33px;

    background:
        linear-gradient(
            180deg,
            #293650,
            #1b263a
        );

    border:
        1px solid #40516f;

    border-radius:9px;

    display:flex;
    align-items:center;

    gap:5px;

    padding:0 8px;

    font-size:9px;

    font-weight:1000;

    overflow:hidden;

    white-space:nowrap;

    box-shadow:
        inset 0 1px 0 #ffffff0b;
}

#turnAvatar{
    flex:0 0 auto;
    font-size:14px;
}

#turnText{
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================
   TABLERO RESPONSIVO
========================= */

#boardArea{
    flex:1 1 auto;

    min-height:0;
    min-width:0;

    width:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:5px 0;
}

#board{
    position:relative;

    width:min(
        100%,
        calc(100dvh - 170px),
        620px
    );

    max-width:100%;
    max-height:100%;

    aspect-ratio:1/1;

    overflow:hidden;

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            #f4e2b0,
            #d5b979
        );

    border:
        3px solid #6e5128;

    box-shadow:
        0 18px 35px #000b,
        0 5px 0 #392813,
        inset 0 0 0 2px #fff4,
        inset 0 0 25px #654a2080;
}

/* brillo del tablero */

#board::before{
    content:"";

    position:absolute;

    inset:0;

    z-index:50;

    pointer-events:none;

    background:
        linear-gradient(
            125deg,
            #ffffff18 0%,
            transparent 35%,
            transparent 70%,
            #00000014 100%
        );
}

/* =========================
   CASILLAS
========================= */

.cell{
    position:absolute;

    width:10%;
    height:10%;

    padding:2px;

    display:flex;

    align-items:flex-start;
    justify-content:flex-end;

    border:
        1px solid #6d572f55;

    color:#3c2b15;

    font-size:
        clamp(
            6px,
            1.8vw,
            11px
        );

    font-weight:1000;

    z-index:1;

    text-shadow:
        0 1px 0 #fff7;

    transition:
        filter .15s ease;
}

.cell:nth-child(odd){
    background:
        linear-gradient(
            145deg,
            #fff2c8,
            #e9cf92
        );
}

.cell:nth-child(even){
    background:
        linear-gradient(
            145deg,
            #e7cf96,
            #c9aa67
        );
}

.cell:hover{
    filter:brightness(1.05);
}

.start{
    background:
        linear-gradient(
            145deg,
            #b9f7bd,
            #6bdc83
        )!important;
}

.finish{
    background:
        linear-gradient(
            145deg,
            #fff28c,
            #ffc928
        )!important;

    box-shadow:
        inset 0 0 12px #fff8;
}

/* =========================
   SVG
========================= */

.connections{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:5;

    pointer-events:none;

    overflow:visible;
}

/* =========================
   FICHAS
========================= */

.token{
    position:absolute;

    width:7%;

    height:7%;

    max-width:32px;
    max-height:32px;

    min-width:16px;
    min-height:16px;

    border:
        2px solid #fff;

    border-radius:50%;

    z-index:20;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:
        clamp(
            8px,
            2.7vw,
            16px
        );

    line-height:1;

    box-shadow:
        0 4px 7px #000b,
        inset 0 2px 4px #fff9,
        inset 0 -4px 6px #0005;

    transform:
        translate(-50%,-50%);

    transition:
        left .12s cubic-bezier(.35,.75,.25,1),
        top .12s cubic-bezier(.35,.75,.25,1);

    will-change:left,top;
}

/* pequeño brillo de ficha */

.token::after{
    content:"";

    position:absolute;

    width:35%;
    height:25%;

    top:13%;
    left:18%;

    border-radius:50%;

    background:#fff9;

    filter:blur(1px);
}

/* =========================
   PANEL INFERIOR
========================= */

.bottom{
    width:100%;

    flex:0 0 auto;

    background:
        linear-gradient(
            145deg,
            #1c2940,
            #111a2a
        );

    border:
        1px solid #40516f;

    border-radius:13px;

    padding:4px;

    box-shadow:
        0 -5px 15px #0005,
        inset 0 1px 0 #ffffff0c;
}

.players{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap:3px;
}

.playerBox{
    min-width:0;

    background:
        linear-gradient(
            180deg,
            #293650,
            #1b263a
        );

    border:
        1px solid transparent;

    border-radius:8px;

    padding:3px;

    text-align:center;

    box-shadow:
        inset 0 1px 0 #ffffff08;
}

.playerBox.active{
    border-color:#ffd84d;

    box-shadow:
        0 0 10px #ffd84d25,
        inset 0 1px 0 #fff2;
}

.avatar{
    font-size:13px;
    line-height:14px;
}

.playerName{
    font-size:7px;

    line-height:8px;

    font-weight:1000;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}

.position{
    color:#9eabc0;

    font-size:6px;

    line-height:7px;
}

.controls{
    display:flex;

    gap:4px;

    margin-top:4px;
}

.dice{
    width:42px;
    height:42px;

    flex:0 0 42px;

    border-radius:10px;

    background:
        linear-gradient(
            145deg,
            #fff,
            #e5e8ed
        );

    color:#111;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:22px;

    box-shadow:
        0 3px 0 #a4aab4,
        0 5px 10px #0006,
        inset 0 1px 0 #fff;
}

.roll{
    flex:1;

    margin:0;

    padding:8px;

    font-size:11px;
}

.status{
    height:11px;

    margin-top:2px;

    text-align:center;

    color:#b4c0d4;

    font-size:7px;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}

/* =========================
   GANADOR
========================= */

#win{
    align-items:center;

    justify-content:center;

    padding:20px;

    text-align:center;
}

.trophy{
    font-size:70px;

    filter:
        drop-shadow(0 8px 8px #0008);

    animation:
        trophyFloat 1.2s ease-in-out infinite alternate;
}

@keyframes trophyFloat{

    from{
        transform:translateY(0) rotate(-2deg);
    }

    to{
        transform:translateY(-10px) rotate(2deg);
    }

}

.winTitle{
    font-size:28px;

    font-weight:1000;

    margin:7px 0;

    background:
        linear-gradient(
            180deg,
            #fff59b,
            #ffd84d
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;
}

.winText{
    color:#aeb9cc;

    font-size:11px;
}

.winButtons{
    width:100%;

    max-width:320px;

    margin-top:10px;
}

/* =========================
   TABLETS / PC
========================= */

@media(min-width:600px){

    .logo .emoji{
        font-size:50px;
    }

    .logo h1{
        font-size:36px;
    }

    .logo p{
        font-size:11px;
    }

    #menu{
        width:min(620px,100%);
        margin:auto;
    }

}

/* =========================
   PANTALLAS BAJAS
========================= */

@media(max-height:650px){

    .logo{
        padding-bottom:4px;
    }

    .logo .emoji{
        font-size:28px;
    }

    .logo h1{
        font-size:22px;
    }

    .logo p{
        margin:3px 0 5px;
        font-size:8px;
    }

    .card{
        padding:6px;
    }

    .setupPlayer{
        padding:3px;
    }

    .setupAvatar{
        width:30px;
        height:30px;
        flex-basis:30px;
        font-size:17px;
    }

    .mainButton{
        padding:7px;
    }

    .secondaryButton{
        padding:6px;
    }

}

/* =========================
   PANTALLAS MUY ANCHAS
========================= */

@media(
    min-width:900px
) and (
    min-height:650px
){

    #game{
        padding-left:20px;
        padding-right:20px;
    }

    #board{
        width:min(
            calc(100dvh - 150px),
            680px
        );
    }

}

/* =========================
   REDUCE MOVIMIENTO
========================= */

@media(
    prefers-reduced-motion:reduce
){

    *{
        scroll-behavior:auto!important;
    }

    .trophy{
        animation:none;
    }

}

</style>
</head>

<body>

<div class="app">

<!-- =========================
     MENÚ
========================= -->

<section id="menu" class="screen active">

    <div class="logo">

        <div class="emoji">
            🐍🪜
        </div>

        <h1>
            COMESERPIENTES
        </h1>

        <p>
            Sube, baja y llega al 100.
        </p>

    </div>


    <div class="card">

        <h2>
            👥 Número de jugadores
        </h2>


        <div class="countOptions">

            <button
                class="countButton selected"
                data-count="2">
                2
            </button>

            <button
                class="countButton"
                data-count="3">
                3
            </button>

            <button
                class="countButton"
                data-count="4">
                4
            </button>

            <button
                class="countButton"
                data-count="5">
                5
            </button>

        </div>


        <div
            id="playerSetup"
            class="playerSetup">
        </div>


        <button
            id="startButton"
            class="mainButton">

            🐍 EMPEZAR COMESERPIENTES

        </button>


        <button
            id="fullscreenButton"
            class="secondaryButton">

            ⛶ PANTALLA COMPLETA

        </button>

    </div>

</section>


<!-- =========================
     JUEGO
========================= -->

<section
    id="game"
    class="screen">


    <div class="top">

        <button
            id="backMenu"
            class="icon">

            ☰

        </button>


        <div class="turn">

            <span id="turnAvatar">
                😀
            </span>

            <span id="turnText">
                Turno
            </span>

        </div>


        <button
            id="newMapButton"
            class="icon">

            🔄

        </button>

    </div>


    <div id="boardArea">

        <div id="board"></div>

    </div>


    <div class="bottom">

        <div
            id="playersPanel"
            class="players">
        </div>


        <div class="controls">

            <div
                id="dice"
                class="dice">

                ⚀

            </div>


            <button
                id="rollButton"
                class="mainButton roll">

                🎲 TIRAR DADO

            </button>

        </div>


        <div
            id="status"
            class="status">

            ¡Que empiece COMESERPIENTES!

        </div>

    </div>

</section>


<!-- =========================
     GANADOR
========================= -->

<section
    id="win"
    class="screen">


    <div class="trophy">
        🏆
    </div>


    <div
        id="winTitle"
        class="winTitle">

        ¡Ganaste!

    </div>


    <div
        id="winText"
        class="winText">

        Llegaste al 100.

    </div>


    <div class="winButtons">

        <button
            id="playAgain"
            class="mainButton">

            🎲 JUGAR OTRA VEZ

        </button>


        <button
            id="winMenu"
            class="secondaryButton">

            🏠 VOLVER AL MENÚ

        </button>

    </div>

</section>

</div>


<script>

/* =========================
   DATOS
========================= */

const colors=[
    "#ff5368",
    "#54a7ff",
    "#8be35c",
    "#b46cff",
    "#ff9f43"
];


const avatars=[
"😀","😃","😄","😁","😆","😅","😂","🤣",
"😊","😇","🙂","🙃","😉","😌","😍","🥰",
"😘","😗","😙","😚","😋","😛","😝","😜",
"🤪","🤨","🧐","🤓","😎","🤩","🥳","😏",
"😒","😞","😔","😟","😕","🙁","☹️","😣",
"😖","😫","😩","🥺","😢","😭","😤","😠",
"😡","🤬","🤯","😳","🥵","🥶","😱","😨",
"😰","😥","😓","🤗","🤔","🫣","🤭","🫢",
"🤫","🤥","😶","🫠","😐","😑","😬","🙄",

function sleep(ms){

    return new Promise(
        resolve=>setTimeout(resolve,ms)
    );

}


function random(min,max){

    return Math.floor(
        Math.random()*(max-min+1)
    )+min;

}


function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function showScreen(id){

}

/* =========================
   COORDENADAS
========================= */

function getRow(cell){

    return Math.floor(
        (cell-1)/10
    );

}


function getCol(cell){

    const row=
        getRow(cell);

    const pos=
        (cell-1)%10;


    return row%2===0
        ?pos
        :9-pos;

}


function cellPosition(cell){

    const row=
        getRow(cell);

    const col=
        getCol(cell);


    return{

        x:col*10+5,

        y:(9-row)*10+5

    };

}


/* =========================
   MAPA
========================= */

function generateMap(){

    ladders={};

    snakes={};


    let attempts=0;


    while(
        Object.keys(ladders).length<5 &&
        attempts<5000
    ){

        attempts++;


        const from=
            random(2,84);

        const to=
            random(from+8,99);


        const fr=
            getRow(from);

        const tr=
            getRow(to);

        const fc=
            getCol(from);

        const tc=
            getCol(to);


        if(fr===tr)
            continue;


        if(fc===tc)
            continue;


        /*
          LAS ESCALERAS
          SIEMPRE TIENEN
          UNA DIFERENCIA
          DIAGONAL CLARA
        */

        if(
            Math.abs(fr-tr)<2 ||
            Math.abs(fc-tc)<2
        )
            continue;


        const used=[

            ...Object.keys(ladders)
                .map(Number),

            ...Object.values(ladders)
                .map(Number),

            ...Object.keys(snakes)
                .map(Number),

            ...Object.values(snakes)
                .map(Number)

        ];


        if(
            used.includes(from) ||
            used.includes(to)
        )
            continue;


        ladders[from]=to;

    }


    attempts=0;


    while(
        Object.keys(snakes).length<6 &&
        attempts<5000
    ){

        attempts++;


        const from=
            random(16,99);

        const to=
            random(2,from-8);


        const fr=
            getRow(from);

        const tr=
            getRow(to);

        const fc=
            getCol(from);

        const tc=
            getCol(to);


        if(fr===tr)
            continue;


        if(fc===tc)
            continue;


        if(
            Math.abs(fr-tr)<2 ||
            Math.abs(fc-tc)<2
        )
            continue;


        const used=[

            ...Object.keys(ladders)
                .map(Number),

            ...Object.values(ladders)
                .map(Number),

            ...Object.keys(snakes)
                .map(Number),

            ...Object.values(snakes)
                .map(Number)

        ];


        if(
            used.includes(from) ||
            used.includes(to)
        )
            continue;


        snakes[from]=to;

    }


    if(
        Object.keys(ladders).length<5
    ){

        ladders={
            4:14,
            9:31,
            20:38,
            28:54,
            51:72
        };

    }


    if(
        Object.keys(snakes).length<6
    ){

        snakes={
            17:7,
            36:16,
            48:26,
            62:43,
            79:59,
            96:74
        };

    }

}

function buildBoard(){

    const board=
        document.getElementById(
            "board"
        );


    board.innerHTML="";


    for(
        let n=1;
        n<=100;
        n++
    ){

        const cell=
            document.createElement(
                "div"
            );


        cell.className="cell";


        if(n===1)
            cell.classList.add("start");


        if(n===100)
            cell.classList.add("finish");


        const p=
            cellPosition(n);


        cell.style.left=
            (p.x-5)+"%";

        cell.style.top=
            (p.y-5)+"%";


        cell.textContent=n;


        board.appendChild(cell);

    }


    const svg=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
        );


    svg.classList.add(
        "connections"
    );


    svg.setAttribute(
        "viewBox",
        "0 0 100 100"
    );


    board.appendChild(svg);


    Object.entries(ladders)
    .forEach(([from,to])=>{

        drawLadder(
            svg,
            Number(from),
            Number(to)
        );

    });


    Object.entries(snakes)
    .forEach(([from,to])=>{

        drawSnake(
            svg,
            Number(from),
            Number(to)
        );

    });


    players.forEach(
        (player,i)=>{

            const token=
                document.createElement(
                    "div"
                );


            token.className=
                "token";

            token.id=
                `token-${i}`;

            token.style.background=
                colors[i];

            token.textContent=
                player.avatar;


            board.appendChild(
                token
            );

        }
    );


    updateTokens();

}


/* =========================
   ESCALERAS
========================= */

function drawLadder(
    svg,
    from,
    to
){

    const a=
        cellPosition(from);

    const b=
        cellPosition(to);


    const dx=
        b.x-a.x;

    const dy=
        b.y-a.y;


    const length=
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    if(!length)
        return;


    const nx=
        -dy/length*1.35;

    const ny=
        dx/length*1.35;


    /*
       SOMBRA
    */

    const shadow1=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );


    shadow1.setAttribute(
        "x1",
        a.x+nx+.6
    );

    shadow1.setAttribute(
        "y1",
        a.y+ny+.8
    );

    shadow1.setAttribute(
        "x2",
        b.x+nx+.6
    );

    shadow1.setAttribute(
        "y2",
        b.y+ny+.8
    );

    shadow1.setAttribute(
        "stroke",
        "#0007"
    );

    shadow1.setAttribute(
        "stroke-width",
        "2.3"
    );

    shadow1.setAttribute(
        "stroke-linecap",
        "round"
    );


    svg.appendChild(
        shadow1
    );


    /*
       RIELES
    */

    const rails=[

        [
            a.x+nx,
            a.y+ny,
            b.x+nx,
            b.y+ny
        ],

        [
            a.x-nx,
            a.y-ny,
            b.x-nx,
            b.y-ny
        ]

    ];


    rails.forEach(
        r=>{

            const line=
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );


            line.setAttribute(
                "x1",
                r[0]
            );

            line.setAttribute(
                "y1",
                r[1]
            );

            line.setAttribute(
                "x2",
                r[2]
            );

            line.setAttribute(
                "y2",
                r[3]
            );


            line.setAttribute(
                "stroke",
                "#553511"
            );

            line.setAttribute(
                "stroke-width",
                "2"
            );

            line.setAttribute(
                "stroke-linecap",
                "round"
            );


            svg.appendChild(line);


            const highlight=
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );


            highlight.setAttribute(
                "x1",
                r[0]-.35
            );

            highlight.setAttribute(
                "y1",
                r[1]-.45
            );

            highlight.setAttribute(
                "x2",
                r[2]-.35
            );

            highlight.setAttribute(
                "y2",
                r[3]-.45
            );


            highlight.setAttribute(
                "stroke",
                "#c8893c"
            );

            highlight.setAttribute(
                "stroke-width",
                ".65"
            );

            highlight.setAttribute(
                "stroke-linecap",
                "round"
            );


            svg.appendChild(
                highlight
            );

        }
    );


    /*
       ESCALONES
    */

    const rungs=
        Math.max(
            4,
            Math.floor(
                length/6
            )
        );


    for(
        let i=1;
        i<rungs;
        i++
    ){

        const t=
            i/rungs;


        const cx=
            a.x+dx*t;

        const cy=
            a.y+dy*t;


        const rung=
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );


        rung.setAttribute(
            "x1",
            cx+nx
        );

        rung.setAttribute(
            "y1",
            cy+ny
        );

        rung.setAttribute(
            "x2",
            cx-nx
        );

        rung.setAttribute(
            "y2",
            cy-ny
        );


        rung.setAttribute(
            "stroke",
            "#6d4319"
        );

        rung.setAttribute(
            "stroke-width",
            "1.5"
        );

        rung.setAttribute(
            "stroke-linecap",
            "round"
        );


        svg.appendChild(
            rung
        );

    }

}


/* =========================
   SERPIENTES
========================= */

function drawSnake(
    svg,
    from,
    to
){

    const a=
        cellPosition(from);

    const b=
        cellPosition(to);


    const dx=
        b.x-a.x;

    const dy=
        b.y-a.y;


    const distance=
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    const steps=
        Math.max(
            12,
            Math.floor(
                distance/2
            )
        );


    const nx=
        -dy/distance;

    const ny=
        dx/distance;


    const amplitude=
        Math.min(
            2,
            Math.max(
                .9,
                distance/18
            )
        );


    const points=[];


    for(
        let i=0;
        i<=steps;
        i++
    ){

        const t=
            i/steps;


        /*
           CURVA NATURAL
        */

        const wave=
            Math.sin(
                t*Math.PI*3.5
            )*
            amplitude;


        points.push({

            x:
                a.x+
                dx*t+
                nx*wave,

            y:
                a.y+
                dy*t+
                ny*wave

        });

    }


    /*
       SOMBRA
    */

    const shadow=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polyline"
        );


    shadow.setAttribute(
        "points",
        points
        .map(
            p=>
                `${p.x+.5},${p.y+.7}`
        )
        .join(" ")
    );


    shadow.setAttribute(
        "fill",
        "none"
    );

    shadow.setAttribute(
        "stroke",
        "#0009"
    );

    shadow.setAttribute(
        "stroke-width",
        "4"
    );

    shadow.setAttribute(
        "stroke-linecap",
        "round"
    );


    svg.appendChild(
        shadow
    );


    /*
       CUERPO
    */

    const body=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polyline"
        );


    body.setAttribute(
        "points",
        points
        .map(
            p=>
                `${p.x},${p.y}`
        )
        .join(" ")
    );


    body.setAttribute(
        "fill",
        "none"
    );

    body.setAttribute(
        "stroke",
        "#174e27"
    );

    body.setAttribute(
        "stroke-width",
        "3"
    );

    body.setAttribute(
        "stroke-linecap",
        "round"
    );

    body.setAttribute(
        "stroke-linejoin",
        "round"
    );


    svg.appendChild(
        body
    );


    /*
       BRILLO
    */

    const highlight=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polyline"
        );


    highlight.setAttribute(
        "points",
        points
        .map(
            p=>
                `${p.x-.3},${p.y-.4}`
        )
        .join(" ")
    );


    highlight.setAttribute(
        "fill",
        "none"
    );

    highlight.setAttribute(
        "stroke",
        "#65c85c"
    );

    highlight.setAttribute(
        "stroke-width",
        ".8"
    );

    highlight.setAttribute(
        "stroke-linecap",
        "round"
    );


    svg.appendChild(
        highlight
    );


    /*
       CABEZA
    */

    const head=
        points[
            points.length-1
        ];


    const headCircle=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );


    headCircle.setAttribute(
        "cx",
        head.x
    );

    headCircle.setAttribute(
        "cy",
        head.y
    );

    headCircle.setAttribute(
        "r",
        "2.3"
    );

    headCircle.setAttribute(
        "fill",
        "#247d35"
    );

    headCircle.setAttribute(
        "stroke",
        "#10391a"
    );

    headCircle.setAttribute(
        "stroke-width",
        ".5"
    );


    svg.appendChild(
        headCircle
    );


    /*
       OJOS
    */

    [-.7,.7].forEach(
        offset=>{

            const eye=
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );


            eye.setAttribute(
                "cx",
                head.x+
                offset
            );

            eye.setAttribute(
                "cy",
                head.y-.65
            );

            eye.setAttribute(
                "r",
                ".55"
            );

            eye.setAttribute(
                "fill",
                "white"
            );


            svg.appendChild(
                eye
            );


            const pupil=
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );


            pupil.setAttribute(
                "cx",
                head.x+
                offset
            );

            pupil.setAttribute(
                "cy",
                head.y-.65
            );

            pupil.setAttribute(
                "r",
                ".25"
            );

            pupil.setAttribute(
                "fill",
                "black"
            );


            svg.appendChild(
                pupil
            );

        }
    );


    /*
       LENGUA
    */

    const tongue=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polyline"
        );


    tongue.setAttribute(
        "points",
        `${head.x},${head.y+1}
         ${head.x},${head.y+2.2}
         ${head.x-.8},${head.y+3}`
    );


    tongue.setAttribute(
        "fill",
        "none"
    );

    tongue.setAttribute(
        "stroke",
        "#e33"
    );

    tongue.setAttribute(
        "stroke-width",
        ".35"
    );


    svg.appendChild(
        tongue
    );

}

function placeToken(index){

    const player=
        players[index];


    const pos=
        cellPosition(
            player.position
        );


    const token=
        document.getElementById(
            `token-${index}`
        );


    if(!token)
        return;


    token.style.left=
        pos.x+"%";


    token.style.top=
        pos.y+"%";

}


function updateTokens(){

    players.forEach(
        (_,i)=>{
            placeToken(i);
        }
    );

}


/* =========================
   PANEL
========================= */

function updatePanel(){

    const panel=
        document.getElementById(
            "playersPanel"
        );


    panel.innerHTML="";


    players.forEach(
        (player,i)=>{

            const box=
                document.createElement(
                    "div"
                );


            box.className=
                "playerBox";


            if(
                i===currentPlayer &&
                !gameFinished
            ){

                box.classList.add(
                    "active"
                );

            }


            box.innerHTML=`

                <div class="avatar">
                    ${player.avatar}
                </div>

                <div class="playerName">
                    ${escapeHTML(player.name)}
                </div>

                <div class="position">
                    ${player.position}
                </div>

            `;


            panel.appendChild(
                box
            );

        }
    );

}


/* =========================
   INICIAR
========================= */

document
.getElementById(
    "startButton"
)
.addEventListener(
    "click",
    startGame
);


function startGame(){

    const rows=
        document.querySelectorAll(
            ".setupPlayer"
        );


    players=[];


    rows.forEach(
        (row,i)=>{

            const input=
                row.querySelector(
                    ".nameInput"
                );


            let name=
                input.value.trim();


            if(!name)
                name=`Jugador ${i+1}`;


            players.push({

                name,

                avatar:
                    avatars[
                        selectedAvatar[i]
                    ],

                position:1,

                bot:
                    botPlayers[i]

            });

        }
    );


    currentPlayer=0;

    rolling=false;

    gameFinished=false;


    generateMap();

    buildBoard();

    showScreen("game");

    updatePanel();

    updateTurn();

    activarFullscreen();


    if(players[0].bot){

        setTimeout(
            botTurn,
            600
        );

    }

}


/* =========================
   TURNO
========================= */

function updateTurn(){

    if(!players[currentPlayer])
        return;


    document
    .getElementById(
        "turnAvatar"
    )
    .textContent=
        players[
            currentPlayer
        ].avatar;


    document
    .getElementById(
        "turnText"
    )
    .textContent=
        `Turno de ${
            players[
                currentPlayer
            ].name
        }`;


    const rollButton=
        document.getElementById(
            "rollButton"
        );


    rollButton.disabled=
        rolling||
        gameFinished||
        players[
            currentPlayer
        ].bot;


    rollButton.style.opacity=
        rollButton.disabled
        ?".5"
        :"1";


    updatePanel();

}


/* =========================
   MOVIMIENTO NORMAL
========================= */

async function movePlayer(
    index,
    steps
){

    const player=
        players[index];


    const direction=
        steps>=0
        ?1
        :-1;


    /*
       MOVIMIENTO CASILLA
       POR CASILLA.

       NO SE TELETRANSPORTA.
       NO SE ACELERA.
       NO HACE COSAS RARAS.
    */

    for(
        let i=0;
        i<Math.abs(steps);
        i++
    ){

        player.position+=
            direction;


        if(
            player.position<1
        ){

            player.position=1;

        }


        if(
            player.position>100
        ){

            player.position=100;

        }


        updateTokens();

        updatePanel();


        await sleep(90);

    }

}


/* =========================
   ANIMACIÓN ESCALERA
========================= */

async function animateLadder(
    index,
    from,
    to
){

    const player=
        players[index];


    const steps=18;


    for(
        let i=1;
        i<=steps;
        i++
    ){

        const t=
            i/steps;


        /*
           EASE IN OUT
           MÁS NATURAL
        */

        const smooth=
            t<.5
            ?4*t*t*t
            :1-
            Math.pow(
                -2*t+2,
                3
            )/2;


        player.position=
            Math.round(
                from+
                (to-from)*
                smooth
            );


        updateTokens();

        updatePanel();


        await sleep(40);

    }


    player.position=to;

    updateTokens();

    updatePanel();

}


/* =========================
   ANIMACIÓN SERPIENTE
========================= */

async function animateSnake(
    index,
    from,
    to
){

    const player=
        players[index];


    const steps=18;


    for(
        let i=1;
        i<=steps;
        i++
    ){

        const t=
            i/steps;


        /*
           BAJADA SUAVE.
        */

        const smooth=
            1-
            Math.pow(
                1-t,
                3
            );


        player.position=
            Math.round(
                from+
                (to-from)*
                smooth
            );


        updateTokens();

        updatePanel();


        await sleep(45);

    }


    player.position=to;

    updateTokens();

    updatePanel();

}


/* =========================
   SERPIENTES / ESCALERAS
========================= */

async function checkConnection(
    index
){

    const player=
        players[index];


    if(
        ladders[
            player.position
        ]
    ){

        const from=
            player.position;

        const to=
            ladders[from];


        document
        .getElementById(
            "status"
        )
        .textContent=
            `🪜 ${player.name} está subiendo...`;


        await animateLadder(
            index,
            from,
            to
        );


        document
        .getElementById(
            "status"
        )
        .textContent=
            `🪜 ${player.name} subió hasta ${to}.`;


        await sleep(180);

        return true;

    }


    if(
        snakes[
            player.position
        ]
    ){

        const from=
            player.position;

        const to=
            snakes[from];


        document
        .getElementById(
            "status"
        )
        .textContent=
            `🐍 ¡${player.name} cayó por la serpiente!`;


        await animateSnake(
            index,
            from,
            to
        );


        document
        .getElementById(
            "status"
        )
        .textContent=
            `🐍 ${player.name} bajó hasta ${to}.`;


        await sleep(180);

        return true;

    }


    return false;

}


/* =========================
   DADO
========================= */

const diceFaces=[
    "⚀",
    "⚁",
    "⚂",
    "⚃",
    "⚄",
    "⚅"
];


async function animateDice(){

    const dice=
        document.getElementById(
            "dice"
        );


    for(
        let i=0;
        i<8;
        i++
    ){

        dice.textContent=
            diceFaces[
                random(1,6)-1
            ];


        await sleep(20);

    }

}


/* =========================
   TIRAR
========================= */

document
.getElementById(
    "rollButton"
)
.addEventListener(
    "click",
    rollDice
);


async function rollDice(){

    if(
        rolling||
        gameFinished||
        players[
            currentPlayer
        ].bot
    ){

        return;

    }


    rolling=true;

    updateTurn();


    const player=
        players[
            currentPlayer
        ];


    document
    .getElementById(
        "status"
    )
    .textContent=
        `${player.name} está tirando...`;


    await animateDice();


    const value=
        random(1,6);


    document
    .getElementById(
        "dice"
    )
    .textContent=
        diceFaces[value-1];


    await executeMove(
        currentPlayer,
        value
    );

}


/* =========================
   EJECUTAR
========================= */

async function executeMove(
    index,
    value
){

    const player=
        players[index];


    document
    .getElementById(
        "status"
    )
    .textContent=
        `${player.name} sacó ${value}.`;


    await sleep(120);


    const target=
        player.position+
        value;


    if(
        target===100
    ){

        await movePlayer(
            index,
            value
        );


        await sleep(200);


        finishGame(index);

        return;

    }


    if(
        target>100
    ){

        const overshoot=
            target-100;


        const forward=
            100-player.position;


        if(forward>0){

            await movePlayer(
                index,
                forward
            );

        }


        await movePlayer(
            index,
            -overshoot
        );


        document
        .getElementById(
            "status"
        )
        .textContent=
            `${player.name} se pasó y retrocede ${overshoot}.`;

    }
    else{

        await movePlayer(
            index,
            value
        );

    }


    await checkConnection(
        index
    );


    await sleep(150);


    nextTurn();

}


/* =========================
   SIGUIENTE
========================= */

function nextTurn(){

    if(gameFinished)
        return;


    currentPlayer=
        (
            currentPlayer+1
        )%
        players.length;


    rolling=false;


    updateTurn();


    if(
        players[
            currentPlayer
        ].bot
    ){

        setTimeout(
            botTurn,
            500
        );

    }
    else{

        document
        .getElementById(
            "status"
        )
        .textContent=
            `🎲 Turno de ${
                players[
                    currentPlayer
                ].name
            }`;

    }

}


/* =========================
   BOT
========================= */

async function botTurn(){

    if(
        rolling||
        gameFinished||
        !players[
            currentPlayer
        ].bot
    ){

        return;

    }


    rolling=true;

    updateTurn();


    const player=
        players[
            currentPlayer
        ];


    document
    .getElementById(
        "status"
    )
    .textContent=
        `🤖 ${player.name} está pensando...`;


    await sleep(300);


    await animateDice();


    const value=
        random(1,6);


    document
    .getElementById(
        "dice"
    )
    .textContent=
        diceFaces[value-1];


    await executeMove(
        currentPlayer,
        value
    );

}


/* =========================
   GANADOR
========================= */

function finishGame(index){

    gameFinished=true;

    rolling=false;


    const player=
        players[index];


    document
    .getElementById(
        "winTitle"
    )
    .textContent=
        `🏆 ¡${player.name} ganó!`;


    document
    .getElementById(
        "winText"
    )
    .textContent=
        `${player.avatar} llegó al casillero 100 de COMESERPIENTES.`;


    showScreen("win");

}


/* =========================
   NUEVO MAPA
========================= */

document
.getElementById(
    "newMapButton"
)
.addEventListener(
    "click",
    ()=>{

        if(
            rolling||
            gameFinished
        )
            return;


        generateMap();

        buildBoard();


        document
        .getElementById(
            "status"
        )
        .textContent=
            "🔄 ¡Nuevo tablero!";

    }
);


/* =========================
   MENÚ
========================= */

document
.getElementById(
    "backMenu"
)
.addEventListener(
    "click",
    ()=>{

        if(rolling)
            return;


        showScreen("menu");

    }
);


document
.getElementById(
    "winMenu"
)
.addEventListener(
    "click",
    ()=>{
        showScreen("menu");
    }
);


/* =========================
   OTRA PARTIDA
========================= */

document
.getElementById(
    "playAgain"
)
.addEventListener(
    "click",
    ()=>{

        players.forEach(
            player=>{
                player.position=1;
            }
        );


        currentPlayer=0;

        rolling=false;

        gameFinished=false;


        generateMap();

        buildBoard();

        showScreen("game");

        updatePanel();

        updateTurn();


        document
        .getElementById(
            "status"
        )
        .textContent=
            "🎲 ¡Nueva partida!";


        if(
            players[0].bot
        ){

            setTimeout(
                botTurn,
                600
            );

        }

    }
);


/* =========================
   FULLSCREEN
========================= */

document
.getElementById(
    "fullscreenButton"
)
.addEventListener(
    "click",
    activarFullscreen
);


async function activarFullscreen(){

    try{

        if(
            !document.fullscreenElement &&
            document.documentElement.requestFullscreen
        ){

            await document
                .documentElement
                .requestFullscreen();

        }

    }
    catch(e){}

}


/* =========================
   INICIAR MENÚ
========================= */

createPlayerSetup();

</script>
